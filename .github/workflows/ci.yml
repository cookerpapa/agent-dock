name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, types, tests, and zero-token spikes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run reproducible local CI checks
        run: npm run ci

      - name: Generate root production-dependency SBOM
        run: |
          mkdir -p dist/ci-evidence
          npm sbom --sbom-format=cyclonedx --omit=dev > dist/ci-evidence/agent-dock-root.cdx.json

      - name: Upload root SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dock-root-sbom
          path: dist/ci-evidence/agent-dock-root.cdx.json
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Hardened containers and portable checkpoint paths
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js for the runtime verifier
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify effective HostConfig and run both containers
        run: npm run container:check

      - name: Verify the fenced Docker Pi workspace path
        run: npm run sandbox:check

      - name: Verify S3-compatible checkpoint portability
        run: npm run object-store:check

  production:
    name: Disposable production topology
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js for the production verifier
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build and verify the complete disposable production topology
        run: npm run production:check

  supply-chain:
    name: SBOM and vulnerability gate (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-plane
            dockerfile: packages/control-plane/Dockerfile
          - image: supervisor-host
            dockerfile: packages/supervisor-host/Dockerfile
          - image: sandbox-manager
            dockerfile: packages/sandbox-manager/Dockerfile
          - image: github-gateway
            dockerfile: packages/github-gateway/Dockerfile
          - image: web-ui
            dockerfile: packages/web-ui/Dockerfile
          - image: tool-sandbox
            dockerfile: packages/tool-sandbox/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build revision-labelled production image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --build-arg AGENT_DOCK_VERSION=ci
          --build-arg AGENT_DOCK_REVISION="${{ github.sha }}"
          --tag "agent-dock/${{ matrix.image }}:ci"
          .

      - name: Prepare evidence directory
        run: mkdir -p evidence

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: agent-dock/${{ matrix.image }}:ci
          format: cyclonedx-json
          output-file: evidence/${{ matrix.image }}.cdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Record all high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0; Trivy v0.70.0
        with:
          scan-type: image
          image-ref: agent-dock/${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: evidence/${{ matrix.image }}.vulnerabilities.json
          exit-code: 0
          timeout: 10m

      - name: Reject fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0; Trivy v0.70.0
        with:
          scan-type: image
          image-ref: agent-dock/${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 1
          timeout: 10m

      - name: Upload image supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dock-${{ matrix.image }}-supply-chain
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
