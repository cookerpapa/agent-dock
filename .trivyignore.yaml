vulnerabilities:
  - id: GHSA-4w2j-m93h-cj5j
    purls:
      - pkg:cargo/quinn-proto@0.11.14
    statement: >-
      Temporal TypeScript SDK 1.21.1 embeds sdk-core with quinn-proto 0.11.14,
      including on the current upstream main branch. AgentDock does not expose
      a QUIC listener, so the advisory's unauthenticated remote QUIC stream
      reassembly path is unreachable. This exception expires quickly and must
      be removed when Temporal publishes a core bridge with quinn-proto 0.11.15.
    expired_at: 2026-08-31
