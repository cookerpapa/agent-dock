name: agent-dock-phase0

services:
  pi-extension-compat:
    image: agent-dock/pi-extension-compat:phase0
    build:
      context: .
      dockerfile: spikes/pi-extension-compat/Dockerfile
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    network_mode: none
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    stop_grace_period: 10s
    restart: "no"
    environment:
      AGENT_DOCK_REQUIRE_NON_ROOT: "1"
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"

  pi-embedded-rehydrate:
    image: agent-dock/pi-embedded-rehydrate:phase0
    build:
      context: .
      dockerfile: spikes/pi-embedded-rehydrate/Dockerfile
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    network_mode: none
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    stop_grace_period: 10s
    restart: "no"
    environment:
      AGENT_DOCK_REQUIRE_NON_ROOT: "1"
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
