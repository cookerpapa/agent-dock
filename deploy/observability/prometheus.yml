global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: agent-dock-control-plane
    bearer_token_file: /run/agent-dock-secrets/metrics-token
    static_configs:
      - targets: [control-plane:9464]
  - job_name: agent-dock-trusted-runner
    bearer_token_file: /run/agent-dock-secrets/metrics-token
    static_configs:
      - targets:
          - supervisor-host:9465
          - supervisor-host-1:9465
          - agent-dock-pi-worker-local-v1-0.metrics.workers.agent-dock.local:80
          - agent-dock-pi-worker-local-v1-1.metrics.workers.agent-dock.local:80
  - job_name: agent-dock-tool-broker
    bearer_token_file: /run/agent-dock-secrets/metrics-token
    static_configs:
      - targets: [tool-broker:9466]
  - job_name: agent-dock-event-gateway
    bearer_token_file: /run/agent-dock-secrets/metrics-token
    static_configs:
      - targets: [event-gateway:9467]
  - job_name: agent-dock-event-retention
    bearer_token_file: /run/agent-dock-secrets/metrics-token
    static_configs:
      - targets: [event-retention:9468]
