    restart: "no"
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        owner=${PI_CLOUD_APPLICATION_UID:-1000}:${PI_CLOUD_APPLICATION_GID:-1000}
        chown -R "$${owner}" /prometheus /grafana /jaeger
        chmod 0700 /prometheus /grafana /jaeger
