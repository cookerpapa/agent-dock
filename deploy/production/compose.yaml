        find /var/lib/agent-dock/boot-volume /var/lib/agent-dock/spool-volume /var/lib/agent-dock/boot-volume-1 /var/lib/agent-dock/spool-volume-1 -type d -exec chmod 0700 {} +
        find /var/lib/agent-dock/boot-volume /var/lib/agent-dock/spool-volume /var/lib/agent-dock/boot-volume-1 /var/lib/agent-dock/spool-volume-1 -type f -exec chmod 0600 {} +
