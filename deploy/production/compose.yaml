      NODE_ENV: production
      DATABASE_URL_FILE: /run/pi-cloud-secrets/database-url
      PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_HOST: 0.0.0.0
      PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_PORT: "4500"
      PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_TOKEN_FILE: /run/pi-cloud-secrets/workspace-volume-gateway-token
      PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_MAXIMUM_CONCURRENT_OPERATIONS: ${PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_MAXIMUM_CONCURRENT_OPERATIONS:-2}
      PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_MAXIMUM_QUEUED_OPERATIONS: ${PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_MAXIMUM_QUEUED_OPERATIONS:-32}
      PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_QUEUE_WAIT_TIMEOUT_MS: ${PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_QUEUE_WAIT_TIMEOUT_MS:-30000}
      PI_CLOUD_WORKSPACE_DELETION_REAPER_INTERVAL_MS: ${PI_CLOUD_WORKSPACE_DELETION_REAPER_INTERVAL_MS:-30000}
