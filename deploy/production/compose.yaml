      service: supervisor-host
    environment:
      PI_CLOUD_SUPERVISOR_ID: ${PI_CLOUD_SUPERVISOR_ID_PREFIX:-pi-cloud-worker-}2
      PI_CLOUD_SUPERVISOR_MANAGEMENT_ADVERTISED_URL: http://${PI_CLOUD_SUPERVISOR_ID_PREFIX:-pi-cloud-worker-}2:4100
    volumes:
      - supervisor-1-boot:/var/lib/pi-cloud/boot-volume
    networks:
      management:
        aliases: !override
          - ${PI_CLOUD_SUPERVISOR_ID_PREFIX:-pi-cloud-worker-}2
      database: {}
      sandbox-control: {}
      model-egress: {}
      github-control: {}
      observability: {}
      api: {}
      event-log: {}

  supervisor-volume-bootstrap:
    profiles: [compose-pi-workers]
    image: pi-cloud/supervisor-host:${PI_CLOUD_IMAGE_VERSION:-production}
    restart: "no"
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        owner=${PI_CLOUD_APPLICATION_UID:-1000}:${PI_CLOUD_APPLICATION_GID:-1000}
        chown -R "$${owner}" /var/lib/pi-cloud/boot-volume /var/lib/pi-cloud/boot-volume-1
        find /var/lib/pi-cloud/boot-volume /var/lib/pi-cloud/boot-volume-1 -type d -exec chmod 0700 {} +
        find /var/lib/pi-cloud/boot-volume /var/lib/pi-cloud/boot-volume-1 -type f -exec chmod 0600 {} +
    user: "0:0"
    volumes:
      - supervisor-boot:/var/lib/pi-cloud/boot-volume
      - supervisor-1-boot:/var/lib/pi-cloud/boot-volume-1
    network_mode: none
    read_only: true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    logging: *bounded-logging

  workspace-volume-gateway:
    image: pi-cloud/tool-broker:${PI_CLOUD_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/tool-broker/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: [/app/packages/tool-broker/src/workspace-volume-gateway-main.ts]
