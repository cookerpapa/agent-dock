    volumes:
      - prometheus-data:/prometheus
      - type: bind
        source: ../observability/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
        target: /run/pi-cloud-secrets/metrics-token
        read_only: true
