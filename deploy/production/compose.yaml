      PI_CLOUD_WORKSPACE_POSIX_ROOT: /data/cube-shared/volume
      PI_CLOUD_METRICS_HOST: 0.0.0.0
      PI_CLOUD_METRICS_PORT: "9469"
      PI_CLOUD_METRICS_TOKEN_FILE: /run/pi-cloud-secrets/metrics-token
    volumes:
      - type: bind
        source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
