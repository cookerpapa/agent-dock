name: agent-dock-production

x-logging: &bounded-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

x-application-build-args: &application-build-args
  AGENT_DOCK_VERSION: ${AGENT_DOCK_IMAGE_VERSION:-production}
  AGENT_DOCK_REVISION: ${AGENT_DOCK_IMAGE_REVISION:-unknown}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}

x-application-security: &application-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-control-plane-runtime-environment: &control-plane-runtime-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  DATABASE_URL_FILE: /run/agent-dock-secrets/database-url
  AGENT_DOCK_SUPERVISOR_ENROLLMENT_TOKEN_FILE: /run/agent-dock-secrets/supervisor-enrollment-token
  AGENT_DOCK_SUPERVISOR_MANAGEMENT_TOKEN_FILE: /run/agent-dock-secrets/supervisor-management-token
  AGENT_DOCK_MODEL_CREDENTIAL_MASTER_KEY_FILE: /run/agent-dock-secrets/model-credential-master-key
  AGENT_DOCK_ALLOW_INSECURE_INTERNAL_HTTP: "true"
  AGENT_DOCK_SUPERVISOR_ID: ${AGENT_DOCK_SUPERVISOR_ID:-agent-dock-supervisor-1}
  AGENT_DOCK_SUPERVISOR_MAXIMUM_CAPACITY: ${AGENT_DOCK_SUPERVISOR_CAPACITY:-2}
  AGENT_DOCK_MAXIMUM_LANES_PER_SUPERVISOR: ${AGENT_DOCK_MAXIMUM_LANES_PER_SUPERVISOR:-8}
  AGENT_DOCK_PLATFORM_MODEL_SOURCE_TENANT_ID: ${AGENT_DOCK_TENANT_ID:?run npm run production:init first}
  AGENT_DOCK_WEB_SESSION_COOKIE_SECURE: ${AGENT_DOCK_WEB_SESSION_COOKIE_SECURE:-false}
  AGENT_DOCK_WEB_SESSION_TTL_MS: ${AGENT_DOCK_WEB_SESSION_TTL_MS:-2592000000}
  AGENT_DOCK_SUPERVISOR_MANAGEMENT_URL: http://supervisor-host:4100
  AGENT_DOCK_GITHUB_GATEWAY_URL: http://github-gateway:4400
  AGENT_DOCK_GITHUB_GATEWAY_TOKEN_FILE: /run/agent-dock-secrets/github-gateway-token
  AGENT_DOCK_PUBLIC_REGISTRATION_ENABLED: ${AGENT_DOCK_PUBLIC_REGISTRATION_ENABLED:-true}
  AGENT_DOCK_PUBLIC_REGISTRATION_MAXIMUM_TENANTS: ${AGENT_DOCK_PUBLIC_REGISTRATION_MAXIMUM_TENANTS:-32}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_PROJECTS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_PROJECTS:-10}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_SESSIONS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_SESSIONS:-100}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_UNSETTLED_TURNS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_UNSETTLED_TURNS:-10}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_CONCURRENT_TURNS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_CONCURRENT_TURNS:-1}
  AGENT_DOCK_METRICS_HOST: 0.0.0.0
  AGENT_DOCK_METRICS_PORT: "9464"
  AGENT_DOCK_METRICS_TOKEN_FILE: /run/agent-dock-secrets/metrics-token
  AGENT_DOCK_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

x-bootstrap-environment: &bootstrap-environment
  NODE_ENV: production
  DATABASE_URL_FILE: /run/agent-dock-secrets/database-url
  AGENT_DOCK_API_TOKEN_FILE: /run/agent-dock-secrets/api-token
  AGENT_DOCK_TENANT_ID: ${AGENT_DOCK_TENANT_ID:?run npm run production:init first}
  AGENT_DOCK_TENANT_SLUG: ${AGENT_DOCK_TENANT_SLUG:-agent-dock}
  AGENT_DOCK_USER_ID: ${AGENT_DOCK_USER_ID:?run npm run production:init first}
  AGENT_DOCK_API_CREDENTIAL_ID: ${AGENT_DOCK_API_CREDENTIAL_ID:-${AGENT_DOCK_USER_ID:?run npm run production:init first}}
  AGENT_DOCK_CREDENTIAL_BINDING_ID: ${AGENT_DOCK_CREDENTIAL_BINDING_ID:?run npm run production:init first}
  AGENT_DOCK_DEFAULT_MODEL_PROFILE_ID: ${AGENT_DOCK_DEFAULT_MODEL_PROFILE_ID:?run npm run production:init first}
  AGENT_DOCK_MODEL_PROFILE_NAME: deterministic-java-repair

x-control-plane-runtime-secrets: &control-plane-runtime-secrets
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
    target: /run/agent-dock-secrets/database-url
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-enrollment-token
    target: /run/agent-dock-secrets/supervisor-enrollment-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-management-token
    target: /run/agent-dock-secrets/supervisor-management-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/model-credential-master-key
    target: /run/agent-dock-secrets/model-credential-master-key
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/github-gateway-token
    target: /run/agent-dock-secrets/github-gateway-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
    target: /run/agent-dock-secrets/metrics-token
    read_only: true

x-bootstrap-secrets: &bootstrap-secrets
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
    target: /run/agent-dock-secrets/database-url
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/api-token
    target: /run/agent-dock-secrets/api-token
    read_only: true

services:
  postgres:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_dock
      POSTGRES_USER: agent_dock
      POSTGRES_PASSWORD_FILE: /run/agent-dock-secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/postgres-password
        target: /run/agent-dock-secrets/postgres-password
        read_only: true
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agent_dock -d agent_dock"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 128m
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        export MINIO_ROOT_USER="$$(cat /run/agent-dock-secrets/minio-root-user)"
        export MINIO_ROOT_PASSWORD="$$(cat /run/agent-dock-secrets/minio-root-password)"
        exec minio server /data --address :9000 --console-address :9001
    volumes:
      - minio-data:/data
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/minio-root-user
        target: /run/agent-dock-secrets/minio-root-user
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/minio-root-password
        target: /run/agent-dock-secrets/minio-root-password
        read_only: true
    networks:
      - object-storage
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /root/.minio:rw,noexec,nosuid,nodev,size=16m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    logging: *bounded-logging

  minio-bootstrap:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        export MC_HOST_agentdock="http://$$(cat /run/agent-dock-secrets/minio-root-user):$$(cat /run/agent-dock-secrets/minio-root-password)@minio:9000"
        bucket=${AGENT_DOCK_CHECKPOINT_BUCKET:-agent-dock-checkpoints}
        {
          IFS= read -r credential_profile
          IFS=' ' read -r access_label access_equals application_access_key
          IFS=' ' read -r secret_label secret_equals application_secret_key
        } < /run/agent-dock-secrets/aws-credentials
        test "$${credential_profile}" = '[default]'
        test "$${access_label}" = 'aws_access_key_id'
        test "$${access_equals}" = '='
        test -n "$${application_access_key}"
        test "$${secret_label}" = 'aws_secret_access_key'
        test "$${secret_equals}" = '='
        test -n "$${application_secret_key}"
        mc mb --ignore-existing "agentdock/$${bucket}"
        mc anonymous set none "agentdock/$${bucket}"
        printf '%s\n' \
          '{"Version":"2012-10-17","Statement":[' \
          "{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$${bucket}\"]}," \
          "{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\"],\"Resource\":[\"arn:aws:s3:::$${bucket}/*\"]}" \
          ']}' > /tmp/agent-dock-checkpoint-policy.json
        mc admin policy create agentdock agent-dock-checkpoint-read-write /tmp/agent-dock-checkpoint-policy.json >/dev/null
        printf '%s\n%s\n' "$${application_access_key}" "$${application_secret_key}" | mc admin user add agentdock >/dev/null
        mc admin policy attach agentdock agent-dock-checkpoint-read-write --user "$${application_access_key}" >/dev/null
        mc stat "agentdock/$${bucket}" >/dev/null
    volumes:
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/minio-root-user
        target: /run/agent-dock-secrets/minio-root-user
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/minio-root-password
        target: /run/agent-dock-secrets/minio-root-password
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/aws-credentials
        target: /run/agent-dock-secrets/aws-credentials
        read_only: true
    networks:
      - object-storage
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /root/.mc:rw,noexec,nosuid,nodev,size=16m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging: *bounded-logging

  database-bootstrap:
    image: agent-dock/control-plane:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
      args: *application-build-args
      network: host
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: [/app/packages/control-plane/src/bootstrap-main.ts]
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    environment: *bootstrap-environment
    volumes: *bootstrap-secrets
    networks:
      - database
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    logging: *bounded-logging

  control-plane:
    image: agent-dock/control-plane:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    environment: *control-plane-runtime-environment
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    volumes: *control-plane-runtime-secrets
    networks:
      - api
      - database
      - management
      - github-control
      - observability
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    logging: *bounded-logging

  supervisor-host:
    image: agent-dock/supervisor-host:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/supervisor-host/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      sandbox-manager:
        condition: service_healthy
      supervisor-volume-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/agent-dock-secrets/database-url
      AWS_SHARED_CREDENTIALS_FILE: /run/agent-dock-secrets/aws-credentials
      AWS_EC2_METADATA_DISABLED: "true"
      AGENT_DOCK_ALLOW_INSECURE_INTERNAL_HTTP: "true"
      AGENT_DOCK_CONTROL_PLANE_URL: http://control-plane:3000
      AGENT_DOCK_SUPERVISOR_ID: ${AGENT_DOCK_SUPERVISOR_ID:-agent-dock-supervisor-1}
      AGENT_DOCK_SUPERVISOR_ENROLLMENT_TOKEN_FILE: /run/agent-dock-secrets/supervisor-enrollment-token
      AGENT_DOCK_SUPERVISOR_MANAGEMENT_TOKEN_FILE: /run/agent-dock-secrets/supervisor-management-token
      AGENT_DOCK_SANDBOX_MANAGER_TOKEN_FILE: /run/agent-dock-secrets/sandbox-manager-token
      AGENT_DOCK_SANDBOX_MANAGER_URL: http://sandbox-manager:4300
      AGENT_DOCK_SANDBOX_MANAGER_REQUEST_TIMEOUT_MS: "300000"
      AGENT_DOCK_MODEL_CREDENTIAL_MASTER_KEY_FILE: /run/agent-dock-secrets/model-credential-master-key
      AGENT_DOCK_SUPERVISOR_MANAGEMENT_HOST: 0.0.0.0
      AGENT_DOCK_SUPERVISOR_MANAGEMENT_PORT: "4100"
      AGENT_DOCK_SUPERVISOR_CAPACITY: ${AGENT_DOCK_SUPERVISOR_CAPACITY:-2}
      AGENT_DOCK_TRUSTED_WORKSPACE_DIRECTORY: /workspace
      AGENT_DOCK_BOOT_STATE_DIRECTORY: /var/lib/agent-dock/boot-volume/state
      AGENT_DOCK_EVENT_SPOOL_DIRECTORY: /var/lib/agent-dock/spool-volume/state
      AGENT_DOCK_MODEL_GATEWAY_HOST: 127.0.0.1
      AGENT_DOCK_MODEL_GATEWAY_PORT: "4200"
      AGENT_DOCK_MODEL_GATEWAY_ADVERTISED_URL: http://127.0.0.1:4200
      AGENT_DOCK_MODEL_GATEWAY_CAPABILITY_TTL_MS: "600000"
      AGENT_DOCK_MODEL_GATEWAY_MAXIMUM_REQUESTS_PER_TURN: "32"
      AGENT_DOCK_MODEL_GATEWAY_UPSTREAM_REQUEST_TIMEOUT_MS: "120000"
      AGENT_DOCK_PI_MODEL_REQUEST_TIMEOUT_MS: "150000"
      AGENT_DOCK_PI_TURN_TIMEOUT_MS: "600000"
      AGENT_DOCK_REPOSITORY_IMPORT_LEASE_MS: "240000"
      AGENT_DOCK_REPOSITORY_IMPORT_WAIT_MS: "300000"
      AGENT_DOCK_GITHUB_GATEWAY_URL: http://github-gateway:4400
      AGENT_DOCK_GITHUB_GATEWAY_TOKEN_FILE: /run/agent-dock-secrets/github-gateway-token
      AGENT_DOCK_CHECKPOINT_S3_BUCKET: ${AGENT_DOCK_CHECKPOINT_BUCKET:-agent-dock-checkpoints}
      AGENT_DOCK_CHECKPOINT_S3_REGION: ${AGENT_DOCK_CHECKPOINT_REGION:-us-east-1}
      AGENT_DOCK_CHECKPOINT_S3_ENDPOINT: http://minio:9000
      AGENT_DOCK_CHECKPOINT_S3_KEY_PREFIX: production/v1
      AGENT_DOCK_CHECKPOINT_S3_FORCE_PATH_STYLE: "true"
      AGENT_DOCK_CHECKPOINT_S3_ALLOW_INSECURE_ENDPOINT: "true"
      AGENT_DOCK_CHECKPOINT_S3_MAX_ATTEMPTS: "4"
      AGENT_DOCK_METRICS_HOST: 0.0.0.0
      AGENT_DOCK_METRICS_PORT: "9465"
      AGENT_DOCK_METRICS_TOKEN_FILE: /run/agent-dock-secrets/metrics-token
      AGENT_DOCK_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - supervisor-boot:/var/lib/agent-dock/boot-volume
      - supervisor-spool:/var/lib/agent-dock/spool-volume
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
        target: /run/agent-dock-secrets/database-url
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-enrollment-token
        target: /run/agent-dock-secrets/supervisor-enrollment-token
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-management-token
        target: /run/agent-dock-secrets/supervisor-management-token
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/sandbox-manager-token
        target: /run/agent-dock-secrets/sandbox-manager-token
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/model-credential-master-key
        target: /run/agent-dock-secrets/model-credential-master-key
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/github-gateway-token
        target: /run/agent-dock-secrets/github-gateway-token
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/aws-credentials
        target: /run/agent-dock-secrets/aws-credentials
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
        target: /run/agent-dock-secrets/metrics-token
        read_only: true
    networks:
      - management
      - database
      - object-storage
      - sandbox-control
      - provider-egress
      - github-control
      - observability
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /workspace:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 256
    mem_limit: 768m
    cpus: 2.0
    stop_grace_period: 45s
    logging: *bounded-logging

  supervisor-volume-bootstrap:
    image: agent-dock/supervisor-host:${AGENT_DOCK_IMAGE_VERSION:-production}
    restart: "no"
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        owner=${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}
        chown -R "$${owner}" /var/lib/agent-dock/boot-volume /var/lib/agent-dock/spool-volume
        find /var/lib/agent-dock/boot-volume /var/lib/agent-dock/spool-volume -type d -exec chmod 0700 {} +
        find /var/lib/agent-dock/boot-volume /var/lib/agent-dock/spool-volume -type f -exec chmod 0600 {} +
    user: "0:0"
    volumes:
      - supervisor-boot:/var/lib/agent-dock/boot-volume
      - supervisor-spool:/var/lib/agent-dock/spool-volume
    network_mode: none
    read_only: true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    logging: *bounded-logging

  sandbox-manager:
    image: agent-dock/sandbox-manager:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/sandbox-manager/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      repository-network-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      AGENT_DOCK_SANDBOX_MANAGER_HOST: 0.0.0.0
      AGENT_DOCK_SANDBOX_MANAGER_PORT: "4300"
      AGENT_DOCK_SANDBOX_MANAGER_TOKEN_FILE: /run/agent-dock-secrets/sandbox-manager-token
      AGENT_DOCK_TOOL_SANDBOX_IMAGE: agent-dock/tool-sandbox:${AGENT_DOCK_IMAGE_VERSION:-production}
      AGENT_DOCK_DOCKER_COMMAND: docker
      AGENT_DOCK_REPOSITORY_IMPORT_NETWORK: ${COMPOSE_PROJECT_NAME:-agent-dock-production}_repository-egress
      AGENT_DOCK_REPOSITORY_IMPORT_TIMEOUT_MS: "180000"
      AGENT_DOCK_METRICS_HOST: 0.0.0.0
      AGENT_DOCK_METRICS_PORT: "9466"
      AGENT_DOCK_METRICS_TOKEN_FILE: /run/agent-dock-secrets/metrics-token
      AGENT_DOCK_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/sandbox-manager-token
        target: /run/agent-dock-secrets/sandbox-manager-token
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
        target: /run/agent-dock-secrets/metrics-token
        read_only: true
    networks:
      - sandbox-control
      - observability
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4300/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    <<: *application-security
    cap_add:
      - DAC_READ_SEARCH
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 30s
    logging: *bounded-logging

  repository-network-bootstrap:
    image: agent-dock/tool-sandbox:${AGENT_DOCK_IMAGE_VERSION:-production}
    restart: "no"
    entrypoint: [/bin/true]
    user: "1000:1000"
    networks:
      - repository-egress
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.1
    logging: *bounded-logging

  github-gateway:
    image: agent-dock/github-gateway:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/github-gateway/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4400"
      AGENT_DOCK_GITHUB_GATEWAY_TOKEN_FILE: /run/agent-dock-secrets/github-gateway-token
      AGENT_DOCK_GITHUB_WEBHOOK_SECRET_FILE: /run/agent-dock-secrets/github-webhook-secret
      AGENT_DOCK_GITHUB_APP_ID: ${AGENT_DOCK_GITHUB_APP_ID:-}
      AGENT_DOCK_GITHUB_APP_PRIVATE_KEY_FILE: /run/agent-dock-secrets/github-app-private-key.pem
      AGENT_DOCK_CONTROL_PLANE_URL: http://control-plane:3000
    volumes:
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/github-gateway-token
        target: /run/agent-dock-secrets/github-gateway-token
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/github-webhook-secret
        target: /run/agent-dock-secrets/github-webhook-secret
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/github-app-private-key.pem
        target: /run/agent-dock-secrets/github-app-private-key.pem
        read_only: true
    networks:
      - github-control
      - provider-egress
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4400/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.75
    stop_grace_period: 15s
    logging: *bounded-logging

  web:
    image: agent-dock/web-ui:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/web-ui/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    ports:
      - ${AGENT_DOCK_HTTP_BIND_ADDRESS:-127.0.0.1}:${AGENT_DOCK_HTTP_PORT:-8080}:8080
    networks:
      - edge
      - api
      - github-control
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=1000,gid=1000
      - /config:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
      - /data:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 15s
    logging: *bounded-logging

  observability-volume-bootstrap:
    image: busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
    restart: "no"
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        owner=${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}
        chown -R "$${owner}" /prometheus /grafana /jaeger
        chmod 0700 /prometheus /grafana /jaeger
    user: "0:0"
    volumes:
      - prometheus-data:/prometheus
      - grafana-data:/grafana
      - jaeger-data:/jaeger
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.1
    logging: *bounded-logging

  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    depends_on:
      observability-volume-bootstrap:
        condition: service_completed_successfully
      control-plane:
        condition: service_healthy
      supervisor-host:
        condition: service_healthy
      sandbox-manager:
        condition: service_healthy
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
      - type: bind
        source: ../observability/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
        target: /run/agent-dock-secrets/metrics-token
        read_only: true
    networks: [observability]
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.75
    stop_grace_period: 30s
    logging: *bounded-logging

  jaeger:
    image: jaegertracing/all-in-one@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    restart: unless-stopped
    depends_on:
      observability-volume-bootstrap:
        condition: service_completed_successfully
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /jaeger/data
      BADGER_DIRECTORY_KEY: /jaeger/key
    volumes:
      - jaeger-data:/jaeger
    networks: [observability]
    read_only: true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.75
    stop_grace_period: 30s
    logging: *bounded-logging

  grafana:
    image: grafana/grafana@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    restart: unless-stopped
    depends_on:
      observability-volume-bootstrap:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    environment:
      GF_SECURITY_ADMIN_USER: agent-dock-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/agent-dock-secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_DATA: /grafana
    volumes:
      - grafana-data:/grafana
      - type: bind
        source: ../observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ../observability/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/grafana-admin-password
        target: /run/agent-dock-secrets/grafana-admin-password
        read_only: true
    networks: [observability]
    read_only: true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    logging: *bounded-logging

  observability-ingress:
    image: agent-dock/web-ui:${AGENT_DOCK_IMAGE_VERSION:-production}
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
      grafana:
        condition: service_started
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
    command: [caddy, run, --config, /etc/caddy/Caddyfile]
    volumes:
      - type: bind
        source: ../observability/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    ports:
      - 127.0.0.1:${AGENT_DOCK_PROMETHEUS_PORT:-9090}:9090
      - 127.0.0.1:${AGENT_DOCK_JAEGER_PORT:-16686}:16686
      - 127.0.0.1:${AGENT_DOCK_GRAFANA_PORT:-3001}:3001
    networks:
      - observability
      - observability-edge
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:9090/-/healthy]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777,uid=1000,gid=1000
      - /config:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=1000,gid=1000
      - /data:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=1000,gid=1000
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 15s
    logging: *bounded-logging

  tool-sandbox-image:
    profiles: [image-only]
    image: agent-dock/tool-sandbox:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/tool-sandbox/Dockerfile
      args: *application-build-args
      network: host
    network_mode: none
    restart: "no"

networks:
  edge: {}
  api:
    internal: true
  database:
    internal: true
  management:
    internal: true
  object-storage:
    internal: true
  sandbox-control:
    internal: true
  github-control:
    internal: true
  provider-egress: {}
  repository-egress:
    name: ${COMPOSE_PROJECT_NAME:-agent-dock-production}_repository-egress
  observability:
    internal: true
  observability-edge: {}

volumes:
  postgres-data: {}
  minio-data: {}
  supervisor-boot: {}
  supervisor-spool: {}
  prometheus-data: {}
  grafana-data: {}
  jaeger-data: {}
