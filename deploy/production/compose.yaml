      - type: bind
        source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/state/cube-shared/volume
        target: /data/cube-shared/volume
      - type: bind
        source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/workspace-volume-gateway-token
        target: /run/pi-cloud-secrets/workspace-volume-gateway-token
        read_only: true
      - type: bind
        source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
        target: /run/pi-cloud-secrets/metrics-token
        read_only: true
    networks:
      - sandbox-control
      - database
      - observability
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4500/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
