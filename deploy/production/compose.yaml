name: agent-dock-production

x-logging: &bounded-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

x-application-build-args: &application-build-args
  AGENT_DOCK_VERSION: ${AGENT_DOCK_IMAGE_VERSION:-production}
  AGENT_DOCK_REVISION: ${AGENT_DOCK_IMAGE_REVISION:-unknown}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}

x-application-security: &application-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-control-plane-runtime-environment: &control-plane-runtime-environment
  NODE_ENV: production
  AGENT_DOCK_IMAGE_REVISION: ${AGENT_DOCK_IMAGE_REVISION:-unknown}
  HOST: 0.0.0.0
  PORT: "3000"
  DATABASE_URL_FILE: /run/agent-dock-secrets/database-url
  AGENT_DOCK_SUPERVISOR_ENROLLMENT_TOKEN_FILE: /run/agent-dock-secrets/supervisor-enrollment-token
  AGENT_DOCK_SUPERVISOR_MANAGEMENT_TOKEN_FILE: /run/agent-dock-secrets/supervisor-management-token
  AGENT_DOCK_MODEL_CREDENTIAL_MASTER_KEY_FILE: /run/agent-dock-secrets/model-credential-master-key
  AGENT_DOCK_CUBE_EGRESS_CONFIG_TOKEN_FILE: /run/agent-dock-secrets/cube-egress-config-token
  AGENT_DOCK_SANDBOX_MANAGER_URL: http://sandbox-manager:4300
  AGENT_DOCK_SANDBOX_MATERIALIZER_TOKEN_FILE: /run/agent-dock-secrets/sandbox-materializer-token
  AGENT_DOCK_ALLOW_INSECURE_INTERNAL_HTTP: "true"
  AGENT_DOCK_SUPERVISOR_ID_PREFIX: ${AGENT_DOCK_SUPERVISOR_ID_PREFIX:-agent-dock-worker-}
  AGENT_DOCK_SUPERVISOR_MAXIMUM_CAPACITY: ${AGENT_DOCK_SUPERVISOR_CAPACITY:-1}
  AGENT_DOCK_PLATFORM_MODEL_SOURCE_TENANT_ID: ${AGENT_DOCK_TENANT_ID:?run npm run production:init first}
  AGENT_DOCK_PLATFORM_OPERATOR_TENANT_ID: ${AGENT_DOCK_PLATFORM_OPERATOR_TENANT_ID:-}
  AGENT_DOCK_WEB_SESSION_COOKIE_SECURE: ${AGENT_DOCK_WEB_SESSION_COOKIE_SECURE:-false}
  AGENT_DOCK_WEB_SESSION_TTL_MS: ${AGENT_DOCK_WEB_SESSION_TTL_MS:-2592000000}
  AGENT_DOCK_SUPERVISOR_MANAGEMENT_URL_TEMPLATE: ${AGENT_DOCK_SUPERVISOR_MANAGEMENT_URL_TEMPLATE:-http://{supervisorId}:4100}
  AGENT_DOCK_TEMPORAL_ADDRESS: temporal:7233
  AGENT_DOCK_TEMPORAL_NAMESPACE: agent-dock
  AGENT_DOCK_TEMPORAL_TASK_QUEUE: agent-dock-pi-runs-v1
  AWS_SHARED_CREDENTIALS_FILE: /run/agent-dock-secrets/aws-credentials
  AWS_EC2_METADATA_DISABLED: "true"
  AGENT_DOCK_CHECKPOINT_S3_BUCKET: ${AGENT_DOCK_CHECKPOINT_BUCKET:-agent-dock-checkpoints}
  AGENT_DOCK_CHECKPOINT_S3_REGION: ${AGENT_DOCK_CHECKPOINT_REGION:-us-east-1}
  AGENT_DOCK_CHECKPOINT_S3_ENDPOINT: http://minio:9000
  AGENT_DOCK_CHECKPOINT_S3_KEY_PREFIX: production/v1
  AGENT_DOCK_CHECKPOINT_S3_FORCE_PATH_STYLE: "true"
  AGENT_DOCK_CHECKPOINT_S3_ALLOW_INSECURE_ENDPOINT: "true"
  AGENT_DOCK_CHECKPOINT_S3_MAX_ATTEMPTS: "4"
  AGENT_DOCK_GITHUB_GATEWAY_URL: http://github-gateway:4400
  AGENT_DOCK_GITHUB_GATEWAY_TOKEN_FILE: /run/agent-dock-secrets/github-gateway-token
  AGENT_DOCK_PUBLIC_REGISTRATION_ENABLED: ${AGENT_DOCK_PUBLIC_REGISTRATION_ENABLED:-true}
  AGENT_DOCK_PUBLIC_REGISTRATION_MAXIMUM_TENANTS: ${AGENT_DOCK_PUBLIC_REGISTRATION_MAXIMUM_TENANTS:-32}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_PROJECTS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_PROJECTS:-10}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_SESSIONS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_SESSIONS:-100}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_UNSETTLED_TURNS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_UNSETTLED_TURNS:-10}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_CONCURRENT_TURNS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_CONCURRENT_TURNS:-2}
  AGENT_DOCK_METRICS_HOST: 0.0.0.0
  AGENT_DOCK_METRICS_PORT: "9464"
  AGENT_DOCK_METRICS_TOKEN_FILE: /run/agent-dock-secrets/metrics-token
  AGENT_DOCK_OTLP_TRACES_ENDPOINT: ${AGENT_DOCK_OTLP_TRACES_ENDPOINT:-}

x-bootstrap-environment: &bootstrap-environment
  NODE_ENV: production
  DATABASE_URL_FILE: /run/agent-dock-secrets/database-url
  AGENT_DOCK_API_TOKEN_FILE: /run/agent-dock-secrets/api-token
  AGENT_DOCK_TENANT_ID: ${AGENT_DOCK_TENANT_ID:?run npm run production:init first}
  AGENT_DOCK_TENANT_SLUG: ${AGENT_DOCK_TENANT_SLUG:-agent-dock}
  AGENT_DOCK_USER_ID: ${AGENT_DOCK_USER_ID:?run npm run production:init first}
  AGENT_DOCK_API_CREDENTIAL_ID: ${AGENT_DOCK_API_CREDENTIAL_ID:?run npm run production:init first}
  AGENT_DOCK_CREDENTIAL_BINDING_ID: ${AGENT_DOCK_CREDENTIAL_BINDING_ID:?run npm run production:init first}
  AGENT_DOCK_DEFAULT_MODEL_PROFILE_ID: ${AGENT_DOCK_DEFAULT_MODEL_PROFILE_ID:?run npm run production:init first}
  AGENT_DOCK_MODEL_PROFILE_NAME: deterministic-java-repair
  AGENT_DOCK_TENANT_MAXIMUM_PROJECTS: ${AGENT_DOCK_TENANT_MAXIMUM_PROJECTS:-100}
  AGENT_DOCK_TENANT_MAXIMUM_SESSIONS: ${AGENT_DOCK_TENANT_MAXIMUM_SESSIONS:-1000}
  AGENT_DOCK_TENANT_MAXIMUM_UNSETTLED_TURNS: ${AGENT_DOCK_TENANT_MAXIMUM_UNSETTLED_TURNS:-100}
  AGENT_DOCK_TENANT_MAXIMUM_CONCURRENT_TURNS: ${AGENT_DOCK_TENANT_MAXIMUM_CONCURRENT_TURNS:-2}

x-control-plane-runtime-secrets: &control-plane-runtime-secrets
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
    target: /run/agent-dock-secrets/database-url
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-enrollment-token
    target: /run/agent-dock-secrets/supervisor-enrollment-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-management-token
    target: /run/agent-dock-secrets/supervisor-management-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/model-credential-master-key
    target: /run/agent-dock-secrets/model-credential-master-key
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/cube-egress-config-token
    target: /run/agent-dock-secrets/cube-egress-config-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/sandbox-materializer-token
    target: /run/agent-dock-secrets/sandbox-materializer-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/github-gateway-token
    target: /run/agent-dock-secrets/github-gateway-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
    target: /run/agent-dock-secrets/metrics-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/aws-credentials
    target: /run/agent-dock-secrets/aws-credentials
    read_only: true

x-bootstrap-secrets: &bootstrap-secrets
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
    target: /run/agent-dock-secrets/database-url
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/api-token
    target: /run/agent-dock-secrets/api-token
    read_only: true

services:
  postgres:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_dock
      POSTGRES_USER: agent_dock
      POSTGRES_PASSWORD_FILE: /run/agent-dock-secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/postgres-password
        target: /run/agent-dock-secrets/postgres-password
        read_only: true
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agent_dock -d agent_dock"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 128m
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  temporal:
    image: temporalio/auto-setup@sha256:5b3502a3b685f9eff1b925af90c57c9e3dbeccbef367cc28a2a9712c63379312
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [/bin/bash, -eu, -o, pipefail, -c]
    command:
      - |
        export POSTGRES_PWD="$$(cat /run/agent-dock-secrets/postgres-password)"
        exec /etc/temporal/entrypoint.sh autosetup
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: agent_dock
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: agent-dock
      DEFAULT_NAMESPACE_RETENTION: 30d
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    volumes:
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/postgres-password
        target: /run/agent-dock-secrets/postgres-password
        read_only: true
      - type: bind
        source: ../temporal/dynamicconfig
        target: /etc/temporal/config/dynamicconfig
        read_only: true
    networks:
      - database
      - temporal
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, 127.0.0.1:7233]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s
    logging: *bounded-logging

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        export MINIO_ROOT_USER="$$(cat /run/agent-dock-secrets/minio-root-user)"
        export MINIO_ROOT_PASSWORD="$$(cat /run/agent-dock-secrets/minio-root-password)"
        exec minio server /data --address :9000 --console-address :9001
    volumes:
      - minio-data:/data
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/minio-root-user
        target: /run/agent-dock-secrets/minio-root-user
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/minio-root-password
        target: /run/agent-dock-secrets/minio-root-password
        read_only: true
    networks:
      - object-storage
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /root/.minio:rw,noexec,nosuid,nodev,size=16m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    logging: *bounded-logging

  minio-bootstrap:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        export MC_HOST_agentdock="http://$$(cat /run/agent-dock-secrets/minio-root-user):$$(cat /run/agent-dock-secrets/minio-root-password)@minio:9000"
        bucket=${AGENT_DOCK_CHECKPOINT_BUCKET:-agent-dock-checkpoints}
        {
          IFS= read -r credential_profile
          IFS=' ' read -r access_label access_equals application_access_key
          IFS=' ' read -r secret_label secret_equals application_secret_key
        } < /run/agent-dock-secrets/aws-credentials
        test "$${credential_profile}" = '[default]'
        test "$${access_label}" = 'aws_access_key_id'
        test "$${access_equals}" = '='
        test -n "$${application_access_key}"
        test "$${secret_label}" = 'aws_secret_access_key'
        test "$${secret_equals}" = '='
        test -n "$${application_secret_key}"
        mc mb --ignore-existing "agentdock/$${bucket}"
        mc anonymous set none "agentdock/$${bucket}"
        printf '%s\n' \
          '{"Version":"2012-10-17","Statement":[' \
          "{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$${bucket}\"]}," \
          "{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\"],\"Resource\":[\"arn:aws:s3:::$${bucket}/*\"]}" \
          ']}' > /tmp/agent-dock-checkpoint-policy.json
        mc admin policy create agentdock agent-dock-checkpoint-read-write /tmp/agent-dock-checkpoint-policy.json >/dev/null
        printf '%s\n%s\n' "$${application_access_key}" "$${application_secret_key}" | mc admin user add agentdock >/dev/null
        mc admin policy attach agentdock agent-dock-checkpoint-read-write --user "$${application_access_key}" >/dev/null
        mc stat "agentdock/$${bucket}" >/dev/null
        kopia_bucket=${AGENT_DOCK_WORKSPACE_KOPIA_BUCKET:-agent-dock-workspace-kopia}
        {
          IFS= read -r kopia_credential_profile
          IFS=' ' read -r kopia_access_label kopia_access_equals kopia_access_key
          IFS=' ' read -r kopia_secret_label kopia_secret_equals kopia_secret_key
        } < /run/agent-dock-secrets/workspace-kopia-aws-credentials
        test "$${kopia_credential_profile}" = '[default]'
        test "$${kopia_access_label}" = 'aws_access_key_id'
        test "$${kopia_access_equals}" = '='
        test -n "$${kopia_access_key}"
        test "$${kopia_secret_label}" = 'aws_secret_access_key'
        test "$${kopia_secret_equals}" = '='
        test -n "$${kopia_secret_key}"
        mc mb --ignore-existing "agentdock/$${kopia_bucket}"
        mc anonymous set none "agentdock/$${kopia_bucket}"
        printf '%s\n' \
          '{"Version":"2012-10-17","Statement":[' \
          "{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\",\"s3:ListBucketMultipartUploads\"],\"Resource\":[\"arn:aws:s3:::$${kopia_bucket}\"]}," \
          "{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:AbortMultipartUpload\",\"s3:ListMultipartUploadParts\"],\"Resource\":[\"arn:aws:s3:::$${kopia_bucket}/*\"]}" \
          ']}' > /tmp/agent-dock-workspace-kopia-policy.json
        mc admin policy create agentdock agent-dock-workspace-kopia-read-write /tmp/agent-dock-workspace-kopia-policy.json >/dev/null
        printf '%s\n%s\n' "$${kopia_access_key}" "$${kopia_secret_key}" | mc admin user add agentdock >/dev/null
        mc admin policy attach agentdock agent-dock-workspace-kopia-read-write --user "$${kopia_access_key}" >/dev/null
        mc stat "agentdock/$${kopia_bucket}" >/dev/null
    volumes:
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/minio-root-user
        target: /run/agent-dock-secrets/minio-root-user
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/minio-root-password
        target: /run/agent-dock-secrets/minio-root-password
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/aws-credentials
        target: /run/agent-dock-secrets/aws-credentials
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/workspace-kopia-aws-credentials
        target: /run/agent-dock-secrets/workspace-kopia-aws-credentials
        read_only: true
    networks:
      - object-storage
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /root/.mc:rw,noexec,nosuid,nodev,size=16m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging: *bounded-logging

  database-bootstrap:
    image: agent-dock/control-plane:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
      args: *application-build-args
      network: host
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: [/app/packages/control-plane/src/bootstrap-main.ts]
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    environment: *bootstrap-environment
    volumes: *bootstrap-secrets
    networks:
      - database
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    logging: *bounded-logging

  control-plane:
    image: agent-dock/control-plane:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    environment: *control-plane-runtime-environment
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    volumes: *control-plane-runtime-secrets
    networks:
      - api
      - database
      - management
      - object-storage
      - sandbox-control
      - github-control
      - observability
      - temporal
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    logging: *bounded-logging

  provider-relay-volume-bootstrap:
    image: agent-dock/provider-egress-relay:${AGENT_DOCK_IMAGE_VERSION:-production}
    restart: "no"
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        owner=${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}
        chmod 0700 /run/agent-dock-provider-relay
        chown "$${owner}" /run/agent-dock-provider-relay
    user: "0:0"
    volumes:
      - provider-relay:/run/agent-dock-provider-relay
    network_mode: none
    read_only: true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.1
    logging: *bounded-logging

  provider-host-egress-relay:
    image: agent-dock/provider-egress-relay:${AGENT_DOCK_IMAGE_VERSION:-production}
    restart: unless-stopped
    depends_on:
      provider-relay-volume-bootstrap:
        condition: service_completed_successfully
    environment:
      AGENT_DOCK_PROVIDER_RELAY_MODE: host
      AGENT_DOCK_PROVIDER_RELAY_SOCKET: /run/agent-dock-provider-relay/provider-egress.sock
      AGENT_DOCK_PROVIDER_RELAY_ALLOWED_HOSTS: api.deepseek.com
      AGENT_DOCK_PROVIDER_RELAY_UPSTREAM_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - provider-relay:/run/agent-dock-provider-relay
    network_mode: host
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('node:net').connect({path:'/run/agent-dock-provider-relay/provider-egress.sock'});s.setTimeout(2000);s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',()=>process.exit(1));s.once('timeout',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 15s
    logging: *bounded-logging

  provider-egress-relay:
    image: agent-dock/provider-egress-relay:${AGENT_DOCK_IMAGE_VERSION:-production}
    restart: unless-stopped
    depends_on:
      provider-host-egress-relay:
        condition: service_healthy
    environment:
      AGENT_DOCK_PROVIDER_RELAY_MODE: bridge
