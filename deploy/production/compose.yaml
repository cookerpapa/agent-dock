name: agent-dock-production

x-logging: &bounded-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

x-application-build-args: &application-build-args
  AGENT_DOCK_VERSION: ${AGENT_DOCK_IMAGE_VERSION:-production}
  AGENT_DOCK_REVISION: ${AGENT_DOCK_IMAGE_REVISION:-unknown}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}

x-application-security: &application-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-control-plane-runtime-environment: &control-plane-runtime-environment
  NODE_ENV: production
  AGENT_DOCK_IMAGE_REVISION: ${AGENT_DOCK_IMAGE_REVISION:-unknown}
  HOST: 0.0.0.0
  PORT: "3000"
  DATABASE_URL_FILE: /run/agent-dock-secrets/database-url
  AGENT_DOCK_SUPERVISOR_ENROLLMENT_TOKEN_FILE: /run/agent-dock-secrets/supervisor-enrollment-token
  AGENT_DOCK_SUPERVISOR_MANAGEMENT_TOKEN_FILE: /run/agent-dock-secrets/supervisor-management-token
  AGENT_DOCK_MODEL_CREDENTIAL_MASTER_KEY_FILE: /run/agent-dock-secrets/model-credential-master-key
  AGENT_DOCK_CUBE_EGRESS_CONFIG_TOKEN_FILE: /run/agent-dock-secrets/cube-egress-config-token
  AGENT_DOCK_TOOL_BROKER_URLS: http://tool-broker:4300
  AGENT_DOCK_SANDBOX_MATERIALIZER_TOKEN_FILE: /run/agent-dock-secrets/sandbox-materializer-token
  AGENT_DOCK_WORKSPACE_TERMINAL_TOKEN_FILE: /run/agent-dock-secrets/workspace-terminal-token
  AGENT_DOCK_ALLOW_INSECURE_INTERNAL_HTTP: "true"
  AGENT_DOCK_SUPERVISOR_ID_PREFIX: ${AGENT_DOCK_SUPERVISOR_ID_PREFIX:-agent-dock-worker-}
  AGENT_DOCK_SUPERVISOR_MAXIMUM_CAPACITY: ${AGENT_DOCK_SUPERVISOR_CAPACITY:-1}
  AGENT_DOCK_PLATFORM_MODEL_SOURCE_TENANT_ID: ${AGENT_DOCK_TENANT_ID:?run npm run production:init first}
  AGENT_DOCK_PLATFORM_OPERATOR_TENANT_ID: ${AGENT_DOCK_PLATFORM_OPERATOR_TENANT_ID:-}
  AGENT_DOCK_WEB_SESSION_COOKIE_SECURE: ${AGENT_DOCK_WEB_SESSION_COOKIE_SECURE:-false}
  AGENT_DOCK_WEB_SESSION_TTL_MS: ${AGENT_DOCK_WEB_SESSION_TTL_MS:-2592000000}
  AGENT_DOCK_SUPERVISOR_MANAGEMENT_URL_TEMPLATES: ${AGENT_DOCK_SUPERVISOR_MANAGEMENT_URL_TEMPLATES:-http://{supervisorId}:4100}
  AGENT_DOCK_ADVANCED_MODULES_ENABLED: ${AGENT_DOCK_ADVANCED_MODULES_ENABLED:-false}
  AGENT_DOCK_EXTERNAL_WORKER_EVENT_LOG: "true"
  AGENT_DOCK_WORKER_EVENT_INGEST_URL: http://event-gateway:4600
  AGENT_DOCK_WORKER_EVENT_INGEST_TOKEN_FILE: /run/agent-dock-secrets/worker-event-ingest-token
  AGENT_DOCK_PUBLIC_REGISTRATION_ENABLED: ${AGENT_DOCK_PUBLIC_REGISTRATION_ENABLED:-true}
  AGENT_DOCK_PUBLIC_REGISTRATION_MAXIMUM_TENANTS: ${AGENT_DOCK_PUBLIC_REGISTRATION_MAXIMUM_TENANTS:-32}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_PROJECTS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_PROJECTS:-10}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_SESSIONS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_SESSIONS:-100}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_UNSETTLED_TURNS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_UNSETTLED_TURNS:-10}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_CONCURRENT_TURNS: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_CONCURRENT_TURNS:-2}
  AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_ACTIVE_SANDBOXES: ${AGENT_DOCK_PUBLIC_TENANT_MAXIMUM_ACTIVE_SANDBOXES:-2}
  AGENT_DOCK_METRICS_HOST: 0.0.0.0
  AGENT_DOCK_METRICS_PORT: "9464"
  AGENT_DOCK_METRICS_TOKEN_FILE: /run/agent-dock-secrets/metrics-token
  AGENT_DOCK_OTLP_TRACES_ENDPOINT: ${AGENT_DOCK_OTLP_TRACES_ENDPOINT:-}

x-bootstrap-environment: &bootstrap-environment
  NODE_ENV: production
  DATABASE_URL_FILE: /run/agent-dock-secrets/database-url
  AGENT_DOCK_API_TOKEN_FILE: /run/agent-dock-secrets/api-token
  AGENT_DOCK_TENANT_ID: ${AGENT_DOCK_TENANT_ID:?run npm run production:init first}
  AGENT_DOCK_TENANT_SLUG: ${AGENT_DOCK_TENANT_SLUG:-agent-dock}
  AGENT_DOCK_USER_ID: ${AGENT_DOCK_USER_ID:?run npm run production:init first}
  AGENT_DOCK_API_CREDENTIAL_ID: ${AGENT_DOCK_API_CREDENTIAL_ID:?run npm run production:init first}
  AGENT_DOCK_CREDENTIAL_BINDING_ID: ${AGENT_DOCK_CREDENTIAL_BINDING_ID:?run npm run production:init first}
  AGENT_DOCK_DEFAULT_MODEL_PROFILE_ID: ${AGENT_DOCK_DEFAULT_MODEL_PROFILE_ID:?run npm run production:init first}
  AGENT_DOCK_MODEL_PROFILE_NAME: deterministic-java-repair
  AGENT_DOCK_TENANT_MAXIMUM_PROJECTS: ${AGENT_DOCK_TENANT_MAXIMUM_PROJECTS:-100}
  AGENT_DOCK_TENANT_MAXIMUM_SESSIONS: ${AGENT_DOCK_TENANT_MAXIMUM_SESSIONS:-1000}
  AGENT_DOCK_TENANT_MAXIMUM_UNSETTLED_TURNS: ${AGENT_DOCK_TENANT_MAXIMUM_UNSETTLED_TURNS:-100}
  AGENT_DOCK_TENANT_MAXIMUM_CONCURRENT_TURNS: ${AGENT_DOCK_TENANT_MAXIMUM_CONCURRENT_TURNS:-2}
  AGENT_DOCK_TENANT_MAXIMUM_ACTIVE_SANDBOXES: ${AGENT_DOCK_TENANT_MAXIMUM_ACTIVE_SANDBOXES:-64}
  AGENT_DOCK_SANDBOX_DOMAINS_JSON: >-
    [{"id":"sandbox-domain-0001","displayName":"Primary sandbox domain","state":"active","toolBrokerBaseUrl":"http://tool-broker:4300","workspaceStorageKey":"workspace-domain-0001","maximumActiveSandboxes":1024}]

x-control-plane-runtime-secrets: &control-plane-runtime-secrets
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
    target: /run/agent-dock-secrets/database-url
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-enrollment-token
    target: /run/agent-dock-secrets/supervisor-enrollment-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-management-token
    target: /run/agent-dock-secrets/supervisor-management-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/model-credential-master-key
    target: /run/agent-dock-secrets/model-credential-master-key
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/cube-egress-config-token
    target: /run/agent-dock-secrets/cube-egress-config-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/sandbox-materializer-token
    target: /run/agent-dock-secrets/sandbox-materializer-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/workspace-terminal-token
    target: /run/agent-dock-secrets/workspace-terminal-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
    target: /run/agent-dock-secrets/metrics-token
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/worker-event-ingest-token
    target: /run/agent-dock-secrets/worker-event-ingest-token
    read_only: true

x-bootstrap-secrets: &bootstrap-secrets
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
    target: /run/agent-dock-secrets/database-url
    read_only: true
  - type: bind
    source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/api-token
    target: /run/agent-dock-secrets/api-token
    read_only: true

services:
  postgres:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_dock
      POSTGRES_USER: agent_dock
      POSTGRES_PASSWORD_FILE: /run/agent-dock-secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/postgres-password
        target: /run/agent-dock-secrets/postgres-password
        read_only: true
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agent_dock -d agent_dock"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 128m
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  kafka:
    image: apache/kafka@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "24"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - event-log
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s
    logging: *bounded-logging

  kafka-bootstrap:
    image: apache/kafka@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/bash, -eu, -o, pipefail, -c]
    command:
      - |
        retention_ms=${AGENT_DOCK_WORKER_EVENT_RETENTION_MS:-86400000}
        if [[ ! "$${retention_ms}" =~ ^[0-9]+$ ]] || (( retention_ms <= 3600000 )); then
          echo "AGENT_DOCK_WORKER_EVENT_RETENTION_MS must exceed the one-hour live replay window" >&2
          exit 1
        fi
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic agent-dock-worker-events-v1 \
          --partitions 24 \
          --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms="$${retention_ms}" \
          --config min.insync.replicas=1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic agent-dock-worker-events-v1
    networks:
      - event-log
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging: *bounded-logging

  valkey:
    image: valkey/valkey@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    restart: unless-stopped
    command:
      [
        valkey-server,
        --appendonly,
        "yes",
        --appendfsync,
        always,
        --maxmemory,
        "${AGENT_DOCK_LIVE_EVENT_MAXMEMORY:-320mb}",
        --maxmemory-policy,
        noeviction,
      ]
    user: "999:1000"
    volumes:
      - valkey-data:/data
    networks:
      - live-events
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    logging: *bounded-logging

  database-bootstrap:
    image: agent-dock/control-plane:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
      args: *application-build-args
      network: host
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: [/app/packages/control-plane/src/bootstrap-main.ts]
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    environment: *bootstrap-environment
    volumes: *bootstrap-secrets
    networks:
      - database
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    logging: *bounded-logging

  control-plane:
    image: agent-dock/control-plane:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      event-gateway:
        condition: service_healthy
    environment: *control-plane-runtime-environment
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    volumes: *control-plane-runtime-secrets
    networks:
      - api
      - database
      - management
      - sandbox-control
      - observability
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    logging: *bounded-logging

  event-retention:
    image: agent-dock/control-plane:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    command: [/app/packages/control-plane/src/event-retention-main.ts]
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/agent-dock-secrets/database-url
      AGENT_DOCK_LIVE_EVENT_STORE_URL_FILE: /run/agent-dock-secrets/live-event-store-url
      AGENT_DOCK_EVENT_RETENTION_INTERVAL_MS: ${AGENT_DOCK_EVENT_RETENTION_INTERVAL_MS:-60000}
      AGENT_DOCK_EVENT_RETENTION_BATCH_SIZE: ${AGENT_DOCK_EVENT_RETENTION_BATCH_SIZE:-100}
      AGENT_DOCK_METRICS_HOST: 0.0.0.0
      AGENT_DOCK_METRICS_PORT: "9468"
      AGENT_DOCK_METRICS_TOKEN_FILE: /run/agent-dock-secrets/metrics-token
      AGENT_DOCK_OTLP_TRACES_ENDPOINT: ${AGENT_DOCK_OTLP_TRACES_ENDPOINT:-}
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    volumes:
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
        target: /run/agent-dock-secrets/database-url
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/live-event-store-url
        target: /run/agent-dock-secrets/live-event-store-url
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
        target: /run/agent-dock-secrets/metrics-token
        read_only: true
    networks:
      - database
      - live-events
      - observability
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    logging: *bounded-logging

  event-gateway:
    image: agent-dock/event-gateway:${AGENT_DOCK_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/event-gateway/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      kafka-bootstrap:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4600"
      DATABASE_URL_FILE: /run/agent-dock-secrets/database-url
      AGENT_DOCK_DATABASE_NOTIFICATION_URL_FILE: /run/agent-dock-secrets/database-url
      AGENT_DOCK_KAFKA_BROKERS: kafka:9092
      AGENT_DOCK_WORKER_EVENT_TOPIC: agent-dock-worker-events-v1
      AGENT_DOCK_WORKER_EVENT_PROJECTOR_GROUP: agent-dock-worker-event-projector-v2
      AGENT_DOCK_WORKER_EVENT_INGEST_TOKEN_FILE: /run/agent-dock-secrets/worker-event-ingest-token
      AGENT_DOCK_LIVE_EVENT_STORE_URL_FILE: /run/agent-dock-secrets/live-event-store-url
      AGENT_DOCK_AUTO_REPAIR_LIVE_EVENTS: ${AGENT_DOCK_AUTO_REPAIR_LIVE_EVENTS:-true}
      AGENT_DOCK_METRICS_HOST: 0.0.0.0
      AGENT_DOCK_METRICS_PORT: "9467"
      AGENT_DOCK_OTLP_TRACES_ENDPOINT: ${AGENT_DOCK_OTLP_TRACES_ENDPOINT:-}
    user: "${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}"
    volumes:
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
        target: /run/agent-dock-secrets/database-url
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/worker-event-ingest-token
        target: /run/agent-dock-secrets/worker-event-ingest-token
        read_only: true
      - type: bind
        source: ${AGENT_DOCK_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/live-event-store-url
        target: /run/agent-dock-secrets/live-event-store-url
        read_only: true
    networks:
      - api
      - database
      - event-log
      - live-events
      - observability
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4600/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=${AGENT_DOCK_APPLICATION_UID:-1000},gid=${AGENT_DOCK_APPLICATION_GID:-1000}
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    logging: *bounded-logging

  provider-relay-volume-bootstrap:
    image: agent-dock/provider-egress-relay:${AGENT_DOCK_IMAGE_VERSION:-production}
    restart: "no"
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        owner=${AGENT_DOCK_APPLICATION_UID:-1000}:${AGENT_DOCK_APPLICATION_GID:-1000}
        chmod 0700 /run/agent-dock-provider-relay
        chown "$${owner}" /run/agent-dock-provider-relay
    user: "0:0"
    volumes:
      - provider-relay:/run/agent-dock-provider-relay
    network_mode: none
    read_only: true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.1
    logging: *bounded-logging

  provider-host-egress-relay:
    image: agent-dock/provider-egress-relay:${AGENT_DOCK_IMAGE_VERSION:-production}
    restart: unless-stopped
    depends_on:
      provider-relay-volume-bootstrap:
        condition: service_completed_successfully
    environment:
      AGENT_DOCK_PROVIDER_RELAY_MODE: host
      AGENT_DOCK_PROVIDER_RELAY_SOCKET: /run/agent-dock-provider-relay/provider-egress.sock
      AGENT_DOCK_PROVIDER_RELAY_ALLOWED_HOSTS: api.deepseek.com
      AGENT_DOCK_PROVIDER_RELAY_UPSTREAM_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - provider-relay:/run/agent-dock-provider-relay
    network_mode: host
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('node:net').connect({path:'/run/agent-dock-provider-relay/provider-egress.sock'});s.setTimeout(2000);s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',()=>process.exit(1));s.once('timeout',()=>process.exit(1))",
        ]
      interval: 5s
