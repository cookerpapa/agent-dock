name: pi-cloud-production

x-logging: &bounded-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

x-application-build-args: &application-build-args
  PI_CLOUD_VERSION: ${PI_CLOUD_IMAGE_VERSION:-production}
  PI_CLOUD_REVISION: ${PI_CLOUD_IMAGE_REVISION:-unknown}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
  NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}

x-application-security: &application-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-control-plane-runtime-environment: &control-plane-runtime-environment
  NODE_ENV: production
  PI_CLOUD_IMAGE_REVISION: ${PI_CLOUD_IMAGE_REVISION:-unknown}
  HOST: 0.0.0.0
  PORT: "3000"
  DATABASE_URL_FILE: /run/pi-cloud-secrets/database-url
  PI_CLOUD_SUPERVISOR_ENROLLMENT_TOKEN_FILE: /run/pi-cloud-secrets/supervisor-enrollment-token
  PI_CLOUD_SUPERVISOR_MANAGEMENT_TOKEN_FILE: /run/pi-cloud-secrets/supervisor-management-token
  PI_CLOUD_MODEL_CREDENTIAL_MASTER_KEY_FILE: /run/pi-cloud-secrets/model-credential-master-key
  PI_CLOUD_CUBE_EGRESS_CONFIG_TOKEN_FILE: /run/pi-cloud-secrets/cube-egress-config-token
  PI_CLOUD_KAFKA_BROKERS: kafka:9092
  PI_CLOUD_KAFKA_RAW_EVENT_TOPIC: pi-cloud.agent-events.raw.v1
  PI_CLOUD_KAFKA_ACCEPTED_EVENT_TOPIC: pi-cloud.agent-events.accepted.v1
  PI_CLOUD_KAFKA_SESSION_MUTATION_TOPIC: pi-cloud.session-mutations.v1
  PI_CLOUD_TOOL_BROKER_URLS: http://tool-broker:4300
  PI_CLOUD_SANDBOX_MATERIALIZER_TOKEN_FILE: /run/pi-cloud-secrets/sandbox-materializer-token
  PI_CLOUD_WORKSPACE_TERMINAL_TOKEN_FILE: /run/pi-cloud-secrets/workspace-terminal-token
  PI_CLOUD_ALLOW_INSECURE_INTERNAL_HTTP: "true"
  PI_CLOUD_SUPERVISOR_ID_PREFIX: ${PI_CLOUD_SUPERVISOR_ID_PREFIX:-pi-cloud-worker-}
  PI_CLOUD_SUPERVISOR_MAXIMUM_CAPACITY: ${PI_CLOUD_SUPERVISOR_CAPACITY:-2}
  PI_CLOUD_PLATFORM_MODEL_SOURCE_TENANT_ID: ${PI_CLOUD_TENANT_ID:?run npm run production:init first}
  PI_CLOUD_PLATFORM_OPERATOR_TENANT_ID: ${PI_CLOUD_PLATFORM_OPERATOR_TENANT_ID:-}
  PI_CLOUD_WEB_SESSION_COOKIE_SECURE: ${PI_CLOUD_WEB_SESSION_COOKIE_SECURE:-false}
  PI_CLOUD_WEB_SESSION_TTL_MS: ${PI_CLOUD_WEB_SESSION_TTL_MS:-2592000000}
  PI_CLOUD_SUPERVISOR_MANAGEMENT_URL_TEMPLATES: ${PI_CLOUD_SUPERVISOR_MANAGEMENT_URL_TEMPLATES:-http://{supervisorId}:4100}
  PI_CLOUD_PUBLIC_REGISTRATION_ENABLED: ${PI_CLOUD_PUBLIC_REGISTRATION_ENABLED:-true}
  PI_CLOUD_PUBLIC_REGISTRATION_MAXIMUM_TENANTS: ${PI_CLOUD_PUBLIC_REGISTRATION_MAXIMUM_TENANTS:-32}
  PI_CLOUD_PUBLIC_TENANT_MAXIMUM_PROJECTS: ${PI_CLOUD_PUBLIC_TENANT_MAXIMUM_PROJECTS:-10}
  PI_CLOUD_PUBLIC_TENANT_MAXIMUM_SESSIONS: ${PI_CLOUD_PUBLIC_TENANT_MAXIMUM_SESSIONS:-100}
  PI_CLOUD_PUBLIC_TENANT_MAXIMUM_UNSETTLED_TURNS: ${PI_CLOUD_PUBLIC_TENANT_MAXIMUM_UNSETTLED_TURNS:-10}
  PI_CLOUD_PUBLIC_TENANT_MAXIMUM_CONCURRENT_TURNS: ${PI_CLOUD_PUBLIC_TENANT_MAXIMUM_CONCURRENT_TURNS:-4}
  PI_CLOUD_PUBLIC_TENANT_MAXIMUM_ACTIVE_SANDBOXES: ${PI_CLOUD_PUBLIC_TENANT_MAXIMUM_ACTIVE_SANDBOXES:-2}
  PI_CLOUD_METRICS_HOST: 0.0.0.0
  PI_CLOUD_METRICS_PORT: "9464"
  PI_CLOUD_METRICS_TOKEN_FILE: /run/pi-cloud-secrets/metrics-token
  PI_CLOUD_OTLP_TRACES_ENDPOINT: ${PI_CLOUD_OTLP_TRACES_ENDPOINT:-}

x-bootstrap-environment: &bootstrap-environment
  NODE_ENV: production
  DATABASE_URL_FILE: /run/pi-cloud-secrets/database-url
  PI_CLOUD_API_TOKEN_FILE: /run/pi-cloud-secrets/api-token
  PI_CLOUD_TENANT_ID: ${PI_CLOUD_TENANT_ID:?run npm run production:init first}
  PI_CLOUD_TENANT_SLUG: ${PI_CLOUD_TENANT_SLUG:-pi-cloud}
  PI_CLOUD_USER_ID: ${PI_CLOUD_USER_ID:?run npm run production:init first}
  PI_CLOUD_API_CREDENTIAL_ID: ${PI_CLOUD_API_CREDENTIAL_ID:?run npm run production:init first}
  PI_CLOUD_CREDENTIAL_BINDING_ID: ${PI_CLOUD_CREDENTIAL_BINDING_ID:?run npm run production:init first}
  PI_CLOUD_DEFAULT_MODEL_PROFILE_ID: ${PI_CLOUD_DEFAULT_MODEL_PROFILE_ID:?run npm run production:init first}
  PI_CLOUD_MODEL_PROFILE_NAME: deterministic-java-repair
  PI_CLOUD_TENANT_MAXIMUM_PROJECTS: ${PI_CLOUD_TENANT_MAXIMUM_PROJECTS:-100}
  PI_CLOUD_TENANT_MAXIMUM_SESSIONS: ${PI_CLOUD_TENANT_MAXIMUM_SESSIONS:-1000}
  PI_CLOUD_TENANT_MAXIMUM_UNSETTLED_TURNS: ${PI_CLOUD_TENANT_MAXIMUM_UNSETTLED_TURNS:-100}
  PI_CLOUD_TENANT_MAXIMUM_CONCURRENT_TURNS: ${PI_CLOUD_TENANT_MAXIMUM_CONCURRENT_TURNS:-4}
  PI_CLOUD_TENANT_MAXIMUM_ACTIVE_SANDBOXES: ${PI_CLOUD_TENANT_MAXIMUM_ACTIVE_SANDBOXES:-64}
  PI_CLOUD_SANDBOX_DOMAINS_JSON: >-
    [{"id":"sandbox-domain-0001","displayName":"Primary sandbox domain","state":"active","toolBrokerBaseUrl":"http://tool-broker:4300","workspaceStorageKey":"workspace-domain-0001","maximumActiveSandboxes":1024}]

x-control-plane-runtime-secrets: &control-plane-runtime-secrets
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
    target: /run/pi-cloud-secrets/database-url
    read_only: true
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-enrollment-token
    target: /run/pi-cloud-secrets/supervisor-enrollment-token
    read_only: true
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/supervisor-management-token
    target: /run/pi-cloud-secrets/supervisor-management-token
    read_only: true
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/model-credential-master-key
    target: /run/pi-cloud-secrets/model-credential-master-key
    read_only: true
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/cube-egress-config-token
    target: /run/pi-cloud-secrets/cube-egress-config-token
    read_only: true
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/sandbox-materializer-token
    target: /run/pi-cloud-secrets/sandbox-materializer-token
    read_only: true
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/workspace-terminal-token
    target: /run/pi-cloud-secrets/workspace-terminal-token
    read_only: true
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/metrics-token
    target: /run/pi-cloud-secrets/metrics-token
    read_only: true

x-bootstrap-secrets: &bootstrap-secrets
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/database-url
    target: /run/pi-cloud-secrets/database-url
    read_only: true
  - type: bind
    source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/api-token
    target: /run/pi-cloud-secrets/api-token
    read_only: true

services:
  postgres:
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: pi_cloud
      POSTGRES_USER: pi_cloud
      POSTGRES_PASSWORD_FILE: /run/pi-cloud-secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/postgres-password
        target: /run/pi-cloud-secrets/postgres-password
        read_only: true
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pi_cloud -d pi_cloud"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 128m
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  kafka:
    image: apache/kafka@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "24"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - event-log
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s
    logging: *bounded-logging

  kafka-bootstrap:
    image: apache/kafka@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/bash, -eu, -o, pipefail, -c]
    command:
      - |
        retention_ms=${PI_CLOUD_AGENT_EVENT_RETENTION_MS:-86400000}
        retention_bytes=${PI_CLOUD_AGENT_EVENT_RETENTION_BYTES_PER_PARTITION:-268435456}
        if [[ ! "$${retention_ms}" =~ ^[0-9]+$ ]] || (( retention_ms < 3600000 )); then
          echo "PI_CLOUD_AGENT_EVENT_RETENTION_MS must retain at least one hour" >&2
          exit 1
        fi
        if [[ ! "$${retention_bytes}" =~ ^[0-9]+$ ]] || (( retention_bytes < 67108864 )); then
          echo "PI_CLOUD_AGENT_EVENT_RETENTION_BYTES_PER_PARTITION must be at least 64 MiB" >&2
          exit 1
        fi
        for topic in pi-cloud.agent-events.raw.v1 pi-cloud.agent-events.accepted.v1 pi-cloud.session-mutations.v1; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$${topic}" \
            --partitions 24 \
            --replication-factor 1 \
            --config cleanup.policy=delete \
            --config retention.ms="$${retention_ms}" \
            --config retention.bytes="$${retention_bytes}" \
            --config min.insync.replicas=1
          /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafka:9092 \
            --entity-type topics \
            --entity-name "$${topic}" \
            --alter \
            --add-config "cleanup.policy=delete,retention.ms=$${retention_ms},retention.bytes=$${retention_bytes},min.insync.replicas=1"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic "$${topic}"
        done
    networks:
      - event-log
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging: *bounded-logging

  database-bootstrap:
    image: pi-cloud/control-plane:${PI_CLOUD_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
      args: *application-build-args
      network: host
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: [/app/packages/control-plane/src/bootstrap-main.ts]
    user: "${PI_CLOUD_APPLICATION_UID:-1000}:${PI_CLOUD_APPLICATION_GID:-1000}"
    environment: *bootstrap-environment
    volumes: *bootstrap-secrets
    networks:
      - database
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=${PI_CLOUD_APPLICATION_UID:-1000},gid=${PI_CLOUD_APPLICATION_GID:-1000}
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.0
    logging: *bounded-logging

  control-plane:
    image: pi-cloud/control-plane:${PI_CLOUD_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/control-plane/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      kafka-bootstrap:
        condition: service_completed_successfully
    environment: *control-plane-runtime-environment
    user: "${PI_CLOUD_APPLICATION_UID:-1000}:${PI_CLOUD_APPLICATION_GID:-1000}"
    volumes: *control-plane-runtime-secrets
    networks:
      - api
      - database
      - management
      - sandbox-control
      - observability
      - event-log
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777,uid=${PI_CLOUD_APPLICATION_UID:-1000},gid=${PI_CLOUD_APPLICATION_GID:-1000}
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    logging: *bounded-logging

  provider-relay-volume-bootstrap:
    image: pi-cloud/provider-egress-relay:${PI_CLOUD_IMAGE_VERSION:-production}
    restart: "no"
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        owner=${PI_CLOUD_APPLICATION_UID:-1000}:${PI_CLOUD_APPLICATION_GID:-1000}
        chmod 0700 /run/pi-cloud-provider-relay
        chown "$${owner}" /run/pi-cloud-provider-relay
    user: "0:0"
    volumes:
      - provider-relay:/run/pi-cloud-provider-relay
    network_mode: none
    read_only: true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.1
    logging: *bounded-logging

  provider-host-egress-relay:
    image: pi-cloud/provider-egress-relay:${PI_CLOUD_IMAGE_VERSION:-production}
    restart: unless-stopped
    depends_on:
      provider-relay-volume-bootstrap:
        condition: service_completed_successfully
    environment:
      PI_CLOUD_PROVIDER_RELAY_MODE: host
      PI_CLOUD_PROVIDER_RELAY_SOCKET: /run/pi-cloud-provider-relay/provider-egress.sock
      PI_CLOUD_PROVIDER_RELAY_ALLOWED_HOSTS: api.deepseek.com
      PI_CLOUD_PROVIDER_RELAY_UPSTREAM_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - provider-relay:/run/pi-cloud-provider-relay
    network_mode: host
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('node:net').connect({path:'/run/pi-cloud-provider-relay/provider-egress.sock'});s.setTimeout(2000);s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',()=>process.exit(1));s.once('timeout',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    user: "${PI_CLOUD_APPLICATION_UID:-1000}:${PI_CLOUD_APPLICATION_GID:-1000}"
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777,uid=${PI_CLOUD_APPLICATION_UID:-1000},gid=${PI_CLOUD_APPLICATION_GID:-1000}
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 15s
    logging: *bounded-logging

  provider-egress-relay:
    image: pi-cloud/provider-egress-relay:${PI_CLOUD_IMAGE_VERSION:-production}
    restart: unless-stopped
    depends_on:
      provider-host-egress-relay:
        condition: service_healthy
    environment:
      PI_CLOUD_PROVIDER_RELAY_MODE: bridge
      PI_CLOUD_PROVIDER_RELAY_SOCKET: /run/pi-cloud-provider-relay/provider-egress.sock
      PI_CLOUD_PROVIDER_RELAY_HOST: 0.0.0.0
      PI_CLOUD_PROVIDER_RELAY_PORT: "3129"
    volumes:
      - provider-relay:/run/pi-cloud-provider-relay
    networks:
      - model-egress
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('node:net').connect(3129,'127.0.0.1');s.setTimeout(2000);s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',()=>process.exit(1));s.once('timeout',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    user: "${PI_CLOUD_APPLICATION_UID:-1000}:${PI_CLOUD_APPLICATION_GID:-1000}"
    <<: *application-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777,uid=${PI_CLOUD_APPLICATION_UID:-1000},gid=${PI_CLOUD_APPLICATION_GID:-1000}
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 15s
    logging: *bounded-logging

  supervisor-host:
    profiles: [compose-pi-workers]
    image: pi-cloud/supervisor-host:${PI_CLOUD_IMAGE_VERSION:-production}
    build:
      context: ../..
      dockerfile: packages/supervisor-host/Dockerfile
      args: *application-build-args
      network: host
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
      tool-broker:
        condition: service_healthy
      provider-egress-relay:
        condition: service_healthy
      supervisor-volume-bootstrap:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://provider-egress-relay:3129
      HTTPS_PROXY: http://provider-egress-relay:3129
      NO_PROXY: 127.0.0.1,localhost,control-plane,tool-broker,github-gateway,jaeger,postgres,supervisor-host,supervisor-host-1,pi-cloud-worker-1,pi-cloud-worker-2
      DATABASE_URL_FILE: /run/pi-cloud-secrets/database-url
      PI_CLOUD_KAFKA_BROKERS: kafka:9092
      PI_CLOUD_KAFKA_RAW_EVENT_TOPIC: pi-cloud.agent-events.raw.v1
      PI_CLOUD_KAFKA_SESSION_MUTATION_TOPIC: pi-cloud.session-mutations.v1
      PI_CLOUD_ALLOW_INSECURE_INTERNAL_HTTP: "true"
      PI_CLOUD_CONTROL_PLANE_URL: http://control-plane:3000
      PI_CLOUD_SUPERVISOR_ID: ${PI_CLOUD_SUPERVISOR_ID_PREFIX:-pi-cloud-worker-}1
      PI_CLOUD_SUPERVISOR_ENROLLMENT_TOKEN_FILE: /run/pi-cloud-secrets/supervisor-enrollment-token
      PI_CLOUD_SUPERVISOR_MANAGEMENT_TOKEN_FILE: /run/pi-cloud-secrets/supervisor-management-token
      PI_CLOUD_TOOL_BROKER_TOKEN_FILE: /run/pi-cloud-secrets/tool-broker-token
      PI_CLOUD_TOOL_BROKER_URLS: http://tool-broker:4300
      PI_CLOUD_TOOL_BROKER_REQUEST_TIMEOUT_MS: "360000"
      PI_CLOUD_MODEL_CREDENTIAL_MASTER_KEY_FILE: /run/pi-cloud-secrets/model-credential-master-key
      PI_CLOUD_SUPERVISOR_MANAGEMENT_HOST: 0.0.0.0
      PI_CLOUD_SUPERVISOR_MANAGEMENT_PORT: "4100"
      PI_CLOUD_SUPERVISOR_MANAGEMENT_ADVERTISED_URL: http://${PI_CLOUD_SUPERVISOR_ID_PREFIX:-pi-cloud-worker-}1:4100
      PI_CLOUD_SUPERVISOR_CAPACITY: ${PI_CLOUD_SUPERVISOR_CAPACITY:-2}
      PI_CLOUD_SUBAGENT_MAXIMUM_DEPTH: ${PI_CLOUD_SUBAGENT_MAXIMUM_DEPTH:-4}
      PI_CLOUD_SUBAGENT_MAXIMUM_NODES: ${PI_CLOUD_SUBAGENT_MAXIMUM_NODES:-32}
      PI_CLOUD_SUBAGENT_MAXIMUM_CONCURRENT: ${PI_CLOUD_SUBAGENT_MAXIMUM_CONCURRENT:-3}
      PI_CLOUD_TRUSTED_WORKSPACE_DIRECTORY: /workspace
      PI_CLOUD_BOOT_STATE_DIRECTORY: /var/lib/pi-cloud/boot-volume/state
      PI_CLOUD_CHECKPOINT_READ_CACHE_TTL_MS: "600000"
      PI_CLOUD_CHECKPOINT_READ_CACHE_MAXIMUM_ENTRIES: "512"
      PI_CLOUD_CHECKPOINT_READ_CACHE_MAXIMUM_BYTES: "33554432"
      PI_CLOUD_MODEL_GATEWAY_HOST: 127.0.0.1
      PI_CLOUD_MODEL_GATEWAY_PORT: "4200"
      PI_CLOUD_MODEL_GATEWAY_ADVERTISED_URL: http://127.0.0.1:4200
      PI_CLOUD_MODEL_GATEWAY_CAPABILITY_TTL_MS: "900000"
      PI_CLOUD_MODEL_GATEWAY_MAXIMUM_REQUESTS_PER_TURN: "128"
