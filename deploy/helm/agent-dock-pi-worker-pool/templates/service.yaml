apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-dock-pi-worker-pool.name" . }}
  labels:
    {{- include "agent-dock-pi-worker-pool.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- include "agent-dock-pi-worker-pool.selectorLabels" . | nindent 4 }}
  ports:
    - name: management
      protocol: TCP
      port: 4100
      targetPort: management
    - name: metrics
      protocol: TCP
      port: 9465
      targetPort: metrics
