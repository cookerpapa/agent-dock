{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-dock-pi-worker-pool.name" . }}
  labels:
    {{- include "agent-dock-pi-worker-pool.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-dock-pi-worker-pool.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.trustedNamespaceLabel.key }}: {{ .Values.networkPolicy.trustedNamespaceLabel.value | quote }}
      ports:
        - protocol: TCP
          port: 4100
        - protocol: TCP
          port: 9465
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.trustedNamespaceLabel.key }}: {{ .Values.networkPolicy.trustedNamespaceLabel.value | quote }}
      ports:
        {{- range .Values.networkPolicy.trustedTcpPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- range .Values.networkPolicy.externalEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- range $.Values.networkPolicy.trustedTcpPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
