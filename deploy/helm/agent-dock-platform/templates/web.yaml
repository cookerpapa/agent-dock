{{- if .Values.globalPlaneEnabled }}
{{- $name := include "agent-dock-platform.name" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-web
  labels:
    {{- include "agent-dock-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ ternary (int .Values.web.autoscaling.minReplicas) (int .Values.web.replicas) .Values.web.autoscaling.enabled }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels:
        {{- include "agent-dock-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: {{ include "agent-dock-platform.image" .Values.images.web | quote }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /config }
            - { name: data, mountPath: /data }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: config, emptyDir: { sizeLimit: 32Mi } }
        - { name: data, emptyDir: { sizeLimit: 32Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }}-web }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ $name }}-web }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ $name }}-web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }}-web }
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.web.autoscaling.targetCpuUtilization }} }
{{- end }}
{{- if .Values.web.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-web
  {{- if .Values.web.ingress.className }}
  annotations: { kubernetes.io/ingress.class: {{ .Values.web.ingress.className | quote }} }
  {{- end }}
spec:
  {{- if .Values.web.ingress.className }}
  ingressClassName: {{ .Values.web.ingress.className }}
  {{- end }}
  {{- if .Values.web.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.web.ingress.host | quote }}]
      secretName: {{ .Values.web.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.web.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $name }}-web, port: { number: 8080 } }
{{- end }}
{{- end }}
