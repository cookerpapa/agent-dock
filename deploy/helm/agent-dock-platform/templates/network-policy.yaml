{{- if .Values.networkPolicy.enabled }}
{{- $labelKey := .Values.networkPolicy.trustedNamespaceLabel.key -}}
{{- $labelValue := .Values.networkPolicy.trustedNamespaceLabel.value -}}
{{- $trustedPorts := .Values.networkPolicy.trustedTcpPorts -}}
{{- $externalCidrs := .Values.networkPolicy.externalEgressCidrs -}}
{{- $name := include "agent-dock-platform.name" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ $name }}-web }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector:
            matchLabels: { {{ $labelKey }}: {{ $labelValue | quote }} }
      ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 4600 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ $name }}-control-plane }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: control-plane }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { {{ $labelKey }}: {{ $labelValue | quote }} }
      ports: [{ protocol: TCP, port: 3000 }, { protocol: TCP, port: 9464 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector:
            matchLabels: { {{ $labelKey }}: {{ $labelValue | quote }} }
      ports:
        {{- range $trustedPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- range $externalCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports:
        {{- range $trustedPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ $name }}-event-gateway }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: event-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { {{ $labelKey }}: {{ $labelValue | quote }} }
      ports: [{ protocol: TCP, port: 4600 }, { protocol: TCP, port: 9467 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector:
            matchLabels: { {{ $labelKey }}: {{ $labelValue | quote }} }
      ports:
        {{- range $trustedPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- range $externalCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports:
        {{- range $trustedPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ $name }}-sandbox-manager }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: sandbox-manager }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { {{ $labelKey }}: {{ $labelValue | quote }} }
      ports: [{ protocol: TCP, port: 4300 }, { protocol: TCP, port: 9466 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector:
            matchLabels: { {{ $labelKey }}: {{ $labelValue | quote }} }
      ports:
        {{- range $trustedPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- range $externalCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports:
        {{- range $trustedPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
{{- end }}
