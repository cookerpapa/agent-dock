{{- if .Values.globalPlaneEnabled }}
{{- $name := include "agent-dock-platform.name" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-event-gateway
  labels:
    {{- include "agent-dock-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-gateway
spec:
  replicas: {{ ternary (int .Values.eventGateway.autoscaling.minReplicas) (int .Values.eventGateway.replicas) .Values.eventGateway.autoscaling.enabled }}
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: event-gateway }
  template:
    metadata:
      labels:
        {{- include "agent-dock-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: event-gateway
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.global.trustedNodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.trustedTolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: event-gateway }
      containers:
        - name: event-gateway
          image: {{ include "agent-dock-platform.image" .Values.images.eventGateway | quote }}
          imagePullPolicy: {{ .Values.images.eventGateway.pullPolicy }}
          ports:
            - { name: http, containerPort: 4600 }
            - { name: metrics, containerPort: 9467 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: HOST, value: 0.0.0.0 }
            - { name: PORT, value: "4600" }
            - { name: DATABASE_URL_FILE, value: /run/agent-dock-secrets/database-url }
            - { name: AGENT_DOCK_DATABASE_NOTIFICATION_URL_FILE, value: /run/agent-dock-secrets/database-notification-url }
            - { name: AGENT_DOCK_METRICS_HOST, value: 0.0.0.0 }
            - { name: AGENT_DOCK_METRICS_PORT, value: "9467" }
            - { name: AGENT_DOCK_METRICS_TOKEN_FILE, value: /run/agent-dock-secrets/metrics-token }
            {{- if .Values.external.otlpTracesEndpoint }}
            - { name: AGENT_DOCK_OTLP_TRACES_ENDPOINT, value: {{ .Values.external.otlpTracesEndpoint | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.eventGateway.resources | nindent 12 }}
          volumeMounts:
            - { name: platform-secrets, mountPath: /run/agent-dock-secrets/database-url, subPath: {{ .Values.external.database.secretKey }}, readOnly: true }
            - { name: platform-secrets, mountPath: /run/agent-dock-secrets/database-notification-url, subPath: {{ .Values.external.database.notificationSecretKey }}, readOnly: true }
            - { name: platform-secrets, mountPath: /run/agent-dock-secrets/metrics-token, subPath: metrics-token, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: platform-secrets
          secret: { secretName: {{ .Values.global.existingSecret }}, defaultMode: 288 }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: event-gateway
  labels:
    {{- include "agent-dock-platform.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: event-gateway }
  ports:
    - { name: http, port: 4600, targetPort: http }
    - { name: metrics, port: 9467, targetPort: metrics }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ $name }}-event-gateway }
spec:
  minAvailable: {{ max 1 (sub (ternary (int .Values.eventGateway.autoscaling.minReplicas) (int .Values.eventGateway.replicas) .Values.eventGateway.autoscaling.enabled) 1) }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: event-gateway }
{{- if .Values.eventGateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ $name }}-event-gateway }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }}-event-gateway }
  minReplicas: {{ .Values.eventGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.eventGateway.autoscaling.maxReplicas }}
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.eventGateway.autoscaling.targetCpuUtilization }} }
{{- end }}
{{- end }}
