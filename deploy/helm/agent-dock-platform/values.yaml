piWorkersEnabled: true

global:
  clusterDomain: cluster.local
  existingSecret: agent-dock-platform-secrets
  imagePullSecrets: []
  imageRevision: development
  storageClassName: ""
  trustedNodeSelector: {}
  trustedTolerations: []

images:
  controlPlane:
    repository: agent-dock/control-plane
    tag: production
    pullPolicy: IfNotPresent
  eventGateway:
    repository: agent-dock/event-gateway
    tag: production
    pullPolicy: IfNotPresent
  web:
    repository: agent-dock/web-ui
    tag: production
    pullPolicy: IfNotPresent
  sandboxManager:
    repository: agent-dock/sandbox-manager
    tag: production
    pullPolicy: IfNotPresent

bootstrap:
  enabled: true
  tenantId: "00000000-0000-4000-8000-000000000001"
  tenantSlug: agent-dock
  userId: "00000000-0000-4000-8000-000000000001"
  apiCredentialId: "00000000-0000-4000-8000-000000000001"
  credentialBindingId: "00000000-0000-4000-8000-000000000001"
  defaultModelProfileId: "00000000-0000-4000-8000-000000000001"
  modelProfileName: agent-dock-default
  maximumProjects: 100
  maximumSessions: 1000
  maximumUnsettledTurns: 100
  maximumConcurrentTurns: 32

controlPlane:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCpuUtilization: 65
  platformModelSourceTenantId: "00000000-0000-4000-8000-000000000001"
  platformOperatorTenantId: "00000000-0000-4000-8000-000000000001"
  publicRegistrationEnabled: true
  supervisorIdPrefix: agent-dock-pi-worker-
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: "2", memory: 1Gi }

eventGateway:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 32
    targetCpuUtilization: 60
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 768Mi }

web:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCpuUtilization: 70
  ingress:
    enabled: false
    className: ""
    host: agent-dock.example.com
    tlsSecretName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

external:
  database:
    # database-url should target PgBouncer transaction pooling. The separate
    # database-notification-url Secret key must target PostgreSQL directly.
    secretKey: database-url
    notificationSecretKey: database-notification-url
    apiTokenSecretKey: api-token
  temporal:
    address: temporal-frontend.temporal.svc.cluster.local:7233
    namespace: agent-dock
    taskQueue: agent-dock-pi-runs-cell-0001-v1
  checkpointS3:
    endpoint: https://s3.example.com
    region: us-east-1
    bucket: agent-dock-checkpoints
    keyPrefix: production/v1
    forcePathStyle: false
    allowInsecureEndpoint: false
  kopiaS3:
    endpoint: s3.example.com
    region: us-east-1
    bucket: agent-dock-workspace-kopia
    prefix: production/kopia/v1/
    disableTls: false
  providerProxyUrl: https://provider-proxy.example.com:3129
  otlpTracesEndpoint: ""

networkPolicy:
  enabled: true
  trustedNamespaceLabel:
    key: agent-dock.io/trusted-plane
    value: "true"
  trustedTcpPorts:
    [443, 3000, 3129, 4100, 4300, 4318, 4600, 5432, 7233, 9000, 9464, 9465, 9466, 9467]
  # Add the explicit CIDRs of external PostgreSQL/PgBouncer, Temporal, S3,
  # provider proxy, Cube API and OTLP endpoints. Never use 0.0.0.0/0 here.
  externalEgressCidrs: []

sandboxPlane:
  replicas: 3
  executionCellId: cell-0001
  maximumActivePerReplica: 128
  maximumWarmPerReplica: 128
  warmTtlMs: 900000
  workspace:
    existingClaim: agent-dock-workspaces-rwx
  state:
    size: 2Gi
  cube:
    apiUrl: https://cube-api.example.com
    templateId: agent-dock-tool-v1
    proxyNodeIp: cube-proxy.example.com
    proxyPort: 443
    proxyScheme: https
    domain: cube.example.com
    egressProxyHost: 10.255.255.254
    egressProxyPort: 3128
  managerResources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 768Mi }
  dataMoverResources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }

pi-workers:
  workerPool:
    name: primary-v1
    replicas: 2
    capacity: 4
    executionCellId: cell-0001
    clusterDomain: cluster.local
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 32
    pollingIntervalSeconds: 5
    cooldownSeconds: 900
    targetQueueSize: 1
    scaleDownStabilizationSeconds: 900
    scaleDownPeriodSeconds: 600
  lifecycle:
    terminationGracePeriodSeconds: 1260
  image:
    repository: agent-dock/supervisor-host
    tag: production
    digest: ""
    pullPolicy: IfNotPresent
  services:
    controlPlaneUrl: http://control-plane:3000
    sandboxManagerUrls:
      - http://sandbox-manager:4300
    githubGateway: { enabled: false, url: http://github-gateway:4400 }
    providerProxyUrl: https://provider-proxy.example.com:3129
    otlpTracesEndpoint: ""
  temporal:
    address: temporal-frontend.temporal.svc.cluster.local:7233
    namespace: agent-dock
    taskQueue: agent-dock-pi-runs-cell-0001-v1
    workerDeploymentName: agent-dock-pi-workers
    workerBuildId: development
  conversationStorage:
    existingSecret: agent-dock-platform-secrets
    databaseUrlKey: database-url
    awsCredentialsKey: aws-credentials
    s3:
      bucket: agent-dock-checkpoints
      region: us-east-1
      endpoint: https://s3.example.com
      keyPrefix: production/v1
      forcePathStyle: false
      allowInsecureEndpoint: false
      maxAttempts: 4
  credentials:
    supervisorEnrollmentTokenKey: supervisor-enrollment-token
    supervisorManagementTokenKey: supervisor-management-token
    sandboxManagerTokenKey: sandbox-manager-token
    modelCredentialMasterKeyKey: model-credential-master-key
    githubGatewayTokenKey: github-gateway-token
    metricsTokenKey: metrics-token
  runtime:
    allowInsecureInternalHttp: true
    checkpointCache: { ttlMs: 600000, maximumEntries: 512, maximumBytes: 33554432 }
    timeouts:
      sandboxManagerRequestMs: 300000
      modelUpstreamRequestMs: 120000
      modelRequestMs: 150000
      turnMs: 600000
    repositoryImport: { leaseMs: 240000, waitMs: 300000 }
  state:
    storageClassName: ""
    accessModes: [ReadWriteOncePod]
    size: 1Gi
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: "2", memory: 1Gi }
  ephemeral: { workspaceSizeLimit: 128Mi, temporarySizeLimit: 128Mi }
  networkPolicy:
    enabled: true
    trustedNamespaceLabel: { key: agent-dock.io/trusted-plane, value: "true" }
    trustedTcpPorts: [443, 3000, 3129, 4300, 4318, 5432, 7233, 9000]
    externalEgressCidrs: []
  disruptionBudget: { minAvailable: 1 }
  placement: { nodeSelector: {}, tolerations: [] }
  management:
    ingress: { enabled: false, className: "", hostSuffix: workers.agent-dock.local, scheme: http }
  serviceAccount: { create: true, name: "" }
