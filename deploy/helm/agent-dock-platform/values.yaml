piWorkersEnabled: true
sandboxPlaneEnabled: true
globalPlaneEnabled: true

sandboxDomains:
  - id: sandbox-domain-0001
    displayName: Primary sandbox domain
    state: active
    toolBrokerBaseUrl: http://tool-broker:4300
    workspaceStorageKey: workspace-domain-0001
    maximumActiveSandboxes: 1024

global:
  clusterDomain: cluster.local
  existingSecret: agent-dock-platform-secrets
  imagePullSecrets: []
  imageRevision: development
  storageClassName: ""
  trustedNodeSelector: {}
  trustedTolerations: []

images:
  controlPlane:
    repository: agent-dock/control-plane
    tag: production
    pullPolicy: IfNotPresent
  eventGateway:
    repository: agent-dock/event-gateway
    tag: production
    pullPolicy: IfNotPresent
  web:
    repository: agent-dock/web-ui
    tag: production
    pullPolicy: IfNotPresent
  toolBroker:
    repository: agent-dock/tool-broker
    tag: production
    pullPolicy: IfNotPresent

bootstrap:
  enabled: true
  tenantId: "00000000-0000-4000-8000-000000000001"
  tenantSlug: agent-dock
  userId: "00000000-0000-4000-8000-000000000001"
  apiCredentialId: "00000000-0000-4000-8000-000000000001"
  credentialBindingId: "00000000-0000-4000-8000-000000000001"
  defaultModelProfileId: "00000000-0000-4000-8000-000000000001"
  modelProfileName: agent-dock-default
  maximumProjects: 100
  maximumSessions: 1000
  maximumUnsettledTurns: 100
  maximumConcurrentTurns: 32
  maximumActiveSandboxes: 64

controlPlane:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCpuUtilization: 65
  platformModelSourceTenantId: "00000000-0000-4000-8000-000000000001"
  platformOperatorTenantId: "00000000-0000-4000-8000-000000000001"
  publicRegistration:
    enabled: true
    maximumTenants: 32
    maximumProjects: 10
    maximumSessions: 100
    maximumUnsettledTurns: 10
    maximumConcurrentTurns: 2
    maximumActiveSandboxes: 2
  supervisorIdPrefix: agent-dock-pi-worker-
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }

eventRetention:
  enabled: true
  replicas: 2
  intervalMs: 60000
  batchSize: 100
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

eventGateway:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 32
    targetCpuUtilization: 60
    pollingIntervalSeconds: 5
    cooldownSeconds: 300
    kafkaLagThreshold: "1000"
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 768Mi }

web:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCpuUtilization: 70
  ingress:
    enabled: false
    className: ""
    host: agent-dock.example.com
    tlsSecretName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

external:
  eventIngest:
    serviceUrl: http://event-gateway:4600
    tokenSecretKey: worker-event-ingest-token
  database:
    # database-url should target PgBouncer transaction pooling. The separate
    # database-notification-url Secret key must target PostgreSQL directly.
    secretKey: database-url
    notificationSecretKey: database-notification-url
    apiTokenSecretKey: api-token
  kafka:
    brokers:
      - agent-dock-kafka-bootstrap.agent-dock-eventing.svc.cluster.local:9093
    topic: agent-dock-worker-events-v1
    projectorGroupId: agent-dock-worker-event-projector-v2
    security:
      enabled: true
      caSecretKey: kafka-ca.crt
      usernameSecretKey: kafka-username
      passwordSecretKey: kafka-password
  liveEventStore:
    urlSecretKey: live-event-store-url
  providerProxyUrl: https://provider-proxy.example.com:3129
  otlpTracesEndpoint: ""

networkPolicy:
  enabled: true
  trustedNamespaceLabel:
    key: agent-dock.io/trusted-plane
    value: "true"
  trustedTcpPorts:
    [443, 3000, 3129, 4100, 4300, 4318, 4600, 5432, 6379, 9093, 9464, 9465, 9466, 9467]
  # Add explicit CIDRs for PostgreSQL/PgBouncer, Kafka, provider proxy,
  # Cube API and OTLP endpoints. Never use 0.0.0.0/0 here.
  externalEgressCidrs: []

sandboxPlane:
  domainId: sandbox-domain-0001
  toolBrokerReplicas: 3
  volumeGatewayReplicas: 2
  volumeGatewayMaximumConcurrentOperations: 2
  volumeGatewayMaximumQueuedOperations: 32
  volumeGatewayQueueWaitTimeoutMs: 30000
  workspaceDeletionReaperIntervalMs: 30000
  workspaceDeletionReaperBatchSize: 16
  volumeGatewayRequestTimeoutMs: 660000
  maximumActivePerReplica: 128
  maximumWarmPerReplica: 128
  warmTtlMs: 900000
  workspace:
    existingClaim: agent-dock-workspaces-rwx
  state:
    size: 2Gi
  cube:
    apiUrl: https://cube-api.example.com
    templateId: agent-dock-tool-v1
    proxyNodeIp: cube-proxy.example.com
    proxyPort: 443
    proxyScheme: https
    domain: cube.example.com
    egressProxyHost: 10.255.255.254
    egressProxyPort: 3128
  toolBrokerResources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 768Mi }
  volumeGatewayResources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }

pi-workers:
  workerPool:
    name: primary-v1
    replicas: 2
    capacity: 4
    clusterDomain: cluster.local
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 32
    pollingIntervalSeconds: 5
    cooldownSeconds: 900
    targetQueuedRunsPerReplica: 4
    scaleDownStabilizationSeconds: 900
    scaleDownPeriodSeconds: 600
  lifecycle:
    terminationGracePeriodSeconds: 1320
  image:
    repository: agent-dock/supervisor-host
    tag: production
    digest: ""
    pullPolicy: IfNotPresent
  services:
    controlPlaneUrl: http://control-plane:3000
    eventGatewayUrl: http://event-gateway:4600
    toolBrokerUrls:
      - http://tool-broker:4300
    githubGateway: { enabled: false, url: http://github-gateway:4400 }
    providerProxyUrl: https://provider-proxy.example.com:3129
    otlpTracesEndpoint: ""
  database:
    existingSecret: agent-dock-platform-secrets
    urlKey: database-url
    notificationUrlKey: database-notification-url
  credentials:
    supervisorEnrollmentTokenKey: supervisor-enrollment-token
    supervisorManagementTokenKey: supervisor-management-token
    toolBrokerTokenKey: tool-broker-token
    modelCredentialMasterKeyKey: model-credential-master-key
    githubGatewayTokenKey: github-gateway-token
    metricsTokenKey: metrics-token
    workerEventIngestTokenKey: worker-event-ingest-token
  runtime:
    allowInsecureInternalHttp: true
    externalWorkerEventLog: true
    checkpointCache: { ttlMs: 600000, maximumEntries: 512, maximumBytes: 33554432 }
    timeouts:
      toolBrokerRequestMs: 360000
      modelCapabilityTtlMs: 900000
      modelUpstreamRequestMs: 120000
      modelRequestMs: 150000
      turnMs: 600000
    repositoryImport: { leaseMs: 240000, waitMs: 300000 }
  state:
    storageClassName: ""
    accessModes: [ReadWriteOncePod]
    size: 1Gi
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: "2", memory: 1Gi }
  ephemeral: { workspaceSizeLimit: 128Mi, temporarySizeLimit: 128Mi }
  networkPolicy:
    enabled: true
    trustedNamespaceLabel: { key: agent-dock.io/trusted-plane, value: "true" }
    trustedTcpPorts: [443, 3000, 3129, 4300, 4318, 4600, 5432, 7233, 9000]
    externalEgressCidrs: []
  disruptionBudget: { minAvailable: 1 }
  placement: { nodeSelector: {}, tolerations: [] }
  management:
    ingress: { enabled: false, className: "", hostSuffix: workers.agent-dock.local, scheme: http }
  serviceAccount: { create: true, name: "" }
