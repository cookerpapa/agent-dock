apiVersion: v2
name: agent-dock-platform
description: Distributed trusted control and execution plane for AgentDock
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.30.0-0"
dependencies:
  - name: agent-dock-pi-worker-pool
    alias: pi-workers
    version: 0.1.0
    repository: file://../agent-dock-pi-worker-pool
    condition: piWorkersEnabled
annotations:
  agent-dock.io/scheduler: postgresql-run-queue
  agent-dock.io/tool-runtime: cubesandbox-kvm
  agent-dock.io/state-authority: postgresql-and-persistent-cube-volume
