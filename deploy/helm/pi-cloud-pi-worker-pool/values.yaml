global:
  imagePullSecrets: []

workerPool:
  name: primary
  replicas: 2
  capacity: 4
  clusterDomain: cluster.local

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 32
  pollingIntervalSeconds: 5
  cooldownSeconds: 900
  targetQueuedRunsPerReplica: 4
  scaleDownStabilizationSeconds: 900
  scaleDownPeriodSeconds: 600

lifecycle:
  terminationGracePeriodSeconds: 1320

management:
  ingress:
    enabled: false
    className: ""
    hostSuffix: workers.pi-cloud.local
    scheme: http

image:
  repository: pi-cloud/supervisor-host
  tag: production
  digest: ""
  pullPolicy: Never

services:
  controlPlaneUrl: http://control-plane.pi-cloud-system.svc.cluster.local:3000
  toolBrokerUrls:
    - http://tool-broker.pi-cloud-system.svc.cluster.local:4300
  githubGateway:
    enabled: false
    url: http://github-gateway.pi-cloud-system.svc.cluster.local:4400
  providerProxyUrl: http://provider-egress-relay.pi-cloud-system.svc.cluster.local:3129
  otlpTracesEndpoint: ""
  kafkaBrokers: [kafka.kafka.svc.cluster.local:9092]
  kafkaRawEventTopic: pi-cloud.agent-events.raw.v1
  kafkaSessionMutationTopic: pi-cloud.session-mutations.v1

database:
  existingSecret: pi-cloud-pi-worker-secrets
  urlKey: database-url
  notificationUrlKey: database-notification-url

credentials:
  supervisorEnrollmentTokenKey: supervisor-enrollment-token
  supervisorManagementTokenKey: supervisor-management-token
  toolBrokerTokenKey: tool-broker-token
  modelCredentialMasterKeyKey: model-credential-master-key
  githubGatewayTokenKey: github-gateway-token
  metricsTokenKey: metrics-token

runtime:
  allowInsecureInternalHttp: true
  subagents:
    maximumDepth: 4
    maximumNodes: 32
    maximumConcurrent: 3
  checkpointCache:
    ttlMs: 600000
    maximumEntries: 512
    maximumBytes: 33554432
  timeouts:
    toolBrokerRequestMs: 360000
    modelCapabilityTtlMs: 900000
    modelUpstreamRequestMs: 120000
    modelRequestMs: 150000
    turnMs: 600000
  repositoryImport:
    leaseMs: 240000
    waitMs: 300000

state:
  storageClassName: ""
  accessModes: [ReadWriteOncePod]
  size: 1Gi

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 4Gi }

ephemeral:
  workspaceSizeLimit: 128Mi
  temporarySizeLimit: 128Mi

networkPolicy:
  enabled: true
  trustedNamespaceLabel:
    key: pi-cloud.io/trusted-plane
    value: "true"
  trustedTcpPorts: [443, 3000, 3129, 4300, 4400, 4318, 5432, 9092]
  externalEgressCidrs: []

disruptionBudget:
  minAvailable: 1

placement:
  nodeSelector: {}
  tolerations: []

serviceAccount:
  create: true
  name: ""
