{{- $name := include "pi-cloud-pi-worker-pool.name" . -}}
{{- $minimumReplicas := ternary (int .Values.autoscaling.minReplicas) (int .Values.workerPool.replicas) .Values.autoscaling.enabled -}}
{{- if and .Values.autoscaling.enabled (lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas)) -}}
{{- fail "autoscaling.maxReplicas must be greater than or equal to autoscaling.minReplicas" -}}
{{- end -}}
{{- if ge (int .Values.disruptionBudget.minAvailable) $minimumReplicas -}}
{{- fail "disruptionBudget.minAvailable must be lower than the minimum Worker replica count" -}}
{{- end -}}
{{- $timeouts := .Values.runtime.timeouts -}}
{{- if lt (int $timeouts.toolBrokerRequestMs) 360000 -}}
{{- fail "runtime.timeouts.toolBrokerRequestMs must outlive the maximum Tool execution" -}}
{{- end -}}
{{- if gt (int $timeouts.modelUpstreamRequestMs) (int $timeouts.modelRequestMs) -}}
{{- fail "runtime.timeouts.modelUpstreamRequestMs cannot exceed modelRequestMs" -}}
{{- end -}}
{{- if gt (int $timeouts.modelRequestMs) (int $timeouts.turnMs) -}}
{{- fail "runtime.timeouts.modelRequestMs cannot exceed turnMs" -}}
{{- end -}}
{{- if lt (int $timeouts.modelCapabilityTtlMs) (add (int $timeouts.turnMs) 60000) -}}
{{- fail "runtime.timeouts.modelCapabilityTtlMs must outlive turnMs by one minute" -}}
{{- end -}}
{{- if lt (int .Values.runtime.repositoryImport.waitMs) (int .Values.runtime.repositoryImport.leaseMs) -}}
{{- fail "runtime.repositoryImport.waitMs cannot expire before leaseMs" -}}
{{- end -}}
{{- $requiredTerminationGraceMs := add (int $timeouts.turnMs) (int $timeouts.toolBrokerRequestMs) 360000 -}}
{{- if lt (mul (int .Values.lifecycle.terminationGracePeriodSeconds) 1000) $requiredTerminationGraceMs -}}
{{- fail "lifecycle.terminationGracePeriodSeconds cannot expire before Worker settlement" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "pi-cloud-pi-worker-pool.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: {{ $minimumReplicas }}
  podManagementPolicy: Parallel
  minReadySeconds: 5
  revisionHistoryLimit: 5
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "pi-cloud-pi-worker-pool.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pi-cloud-pi-worker-pool.labels" . | nindent 8 }}
      annotations:
        pi-cloud.io/durable-authority: postgresql
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pi-cloud-pi-worker-pool.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pi-cloud-pi-worker-pool.selectorLabels" . | nindent 14 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "pi-cloud-pi-worker-pool.selectorLabels" . | nindent 20 }}
      {{- with .Values.placement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pi-worker
          image: {{ include "pi-cloud-pi-worker-pool.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: management
              containerPort: 4100
              protocol: TCP
            - name: metrics
              containerPort: 9465
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_ENV
              value: production
            - name: NODE_USE_ENV_PROXY
              value: "1"
            {{- if .Values.services.providerProxyUrl }}
            - name: HTTP_PROXY
              value: {{ .Values.services.providerProxyUrl | quote }}
            - name: HTTPS_PROXY
              value: {{ .Values.services.providerProxyUrl | quote }}
            {{- end }}
            - name: NO_PROXY
              value: {{ printf "127.0.0.1,localhost,tool-broker,.svc,.svc.%s" .Values.workerPool.clusterDomain | quote }}
            - name: DATABASE_URL_FILE
              value: /run/pi-cloud-secrets/database-url
            - name: DATABASE_NOTIFICATION_URL_FILE
              value: /run/pi-cloud-secrets/database-notification-url
            - name: PI_CLOUD_EXTERNAL_WORKER_EVENT_LOG
              value: {{ .Values.runtime.externalWorkerEventLog | quote }}
            {{- if .Values.runtime.externalWorkerEventLog }}
            - name: PI_CLOUD_WORKER_EVENT_INGEST_URL
              value: {{ .Values.services.eventGatewayUrl | quote }}
            - name: PI_CLOUD_WORKER_EVENT_INGEST_TOKEN_FILE
              value: /run/pi-cloud-secrets/worker-event-ingest-token
            {{- end }}
            - name: PI_CLOUD_ALLOW_INSECURE_INTERNAL_HTTP
              value: {{ .Values.runtime.allowInsecureInternalHttp | quote }}
            - name: PI_CLOUD_CONTROL_PLANE_URL
              value: {{ .Values.services.controlPlaneUrl | quote }}
            - name: PI_CLOUD_SUPERVISOR_ID
              value: $(POD_NAME)
            - name: PI_CLOUD_SUPERVISOR_ENROLLMENT_TOKEN_FILE
              value: /run/pi-cloud-secrets/supervisor-enrollment-token
            - name: PI_CLOUD_SUPERVISOR_MANAGEMENT_TOKEN_FILE
              value: /run/pi-cloud-secrets/supervisor-management-token
            - name: PI_CLOUD_TOOL_BROKER_TOKEN_FILE
              value: /run/pi-cloud-secrets/tool-broker-token
            - name: PI_CLOUD_TOOL_BROKER_URLS
              value: {{ join "," .Values.services.toolBrokerUrls | quote }}
            - name: PI_CLOUD_TOOL_BROKER_REQUEST_TIMEOUT_MS
              value: {{ .Values.runtime.timeouts.toolBrokerRequestMs | quote }}
            - name: PI_CLOUD_MODEL_CREDENTIAL_MASTER_KEY_FILE
              value: /run/pi-cloud-secrets/model-credential-master-key
            - name: PI_CLOUD_SUPERVISOR_MANAGEMENT_HOST
              value: 0.0.0.0
            - name: PI_CLOUD_SUPERVISOR_MANAGEMENT_PORT
              value: "4100"
            - name: PI_CLOUD_SUPERVISOR_MANAGEMENT_ADVERTISED_URL
              {{- if .Values.management.ingress.enabled }}
              value: {{ printf "%s://$(POD_NAME).%s" .Values.management.ingress.scheme .Values.management.ingress.hostSuffix | quote }}
              {{- else }}
              value: {{ printf "http://$(POD_NAME).%s.$(POD_NAMESPACE).svc.%s:4100" $name .Values.workerPool.clusterDomain | quote }}
              {{- end }}
            - name: PI_CLOUD_SUPERVISOR_CAPACITY
              value: {{ .Values.workerPool.capacity | quote }}
            - name: PI_CLOUD_TRUSTED_WORKSPACE_DIRECTORY
              value: /workspace
            - name: PI_CLOUD_BOOT_STATE_DIRECTORY
              value: /var/lib/pi-cloud/boot
            - name: PI_CLOUD_EVENT_SPOOL_DIRECTORY
              value: /var/lib/pi-cloud/spool
            - name: PI_CLOUD_CHECKPOINT_READ_CACHE_TTL_MS
              value: {{ .Values.runtime.checkpointCache.ttlMs | quote }}
            - name: PI_CLOUD_CHECKPOINT_READ_CACHE_MAXIMUM_ENTRIES
              value: {{ .Values.runtime.checkpointCache.maximumEntries | quote }}
            - name: PI_CLOUD_CHECKPOINT_READ_CACHE_MAXIMUM_BYTES
              value: {{ .Values.runtime.checkpointCache.maximumBytes | quote }}
            - name: PI_CLOUD_MODEL_GATEWAY_HOST
              value: 127.0.0.1
            - name: PI_CLOUD_MODEL_GATEWAY_PORT
              value: "4200"
            - name: PI_CLOUD_MODEL_GATEWAY_ADVERTISED_URL
              value: http://127.0.0.1:4200
            - name: PI_CLOUD_MODEL_GATEWAY_CAPABILITY_TTL_MS
              value: {{ .Values.runtime.timeouts.modelCapabilityTtlMs | quote }}
            - name: PI_CLOUD_MODEL_GATEWAY_MAXIMUM_REQUESTS_PER_TURN
              value: "128"
            - name: PI_CLOUD_MODEL_GATEWAY_UPSTREAM_REQUEST_TIMEOUT_MS
              value: {{ .Values.runtime.timeouts.modelUpstreamRequestMs | quote }}
            - name: PI_CLOUD_PI_MODEL_REQUEST_TIMEOUT_MS
              value: {{ .Values.runtime.timeouts.modelRequestMs | quote }}
            - name: PI_CLOUD_PI_TURN_TIMEOUT_MS
              value: {{ .Values.runtime.timeouts.turnMs | quote }}
            - name: PI_CLOUD_REPOSITORY_IMPORT_LEASE_MS
              value: {{ .Values.runtime.repositoryImport.leaseMs | quote }}
            - name: PI_CLOUD_REPOSITORY_IMPORT_WAIT_MS
              value: {{ .Values.runtime.repositoryImport.waitMs | quote }}
            {{- if .Values.services.githubGateway.enabled }}
            - name: PI_CLOUD_GITHUB_GATEWAY_URL
              value: {{ .Values.services.githubGateway.url | quote }}
            - name: PI_CLOUD_GITHUB_GATEWAY_TOKEN_FILE
              value: /run/pi-cloud-secrets/github-gateway-token
            {{- end }}
            - name: PI_CLOUD_METRICS_HOST
              value: 0.0.0.0
            - name: PI_CLOUD_METRICS_PORT
              value: "9465"
            - name: PI_CLOUD_METRICS_TOKEN_FILE
              value: /run/pi-cloud-secrets/metrics-token
            {{- if .Values.services.otlpTracesEndpoint }}
            - name: PI_CLOUD_OTLP_TRACES_ENDPOINT
              value: {{ .Values.services.otlpTracesEndpoint | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 40
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: worker-state
              mountPath: /var/lib/pi-cloud
            - name: workspace
              mountPath: /workspace
            - name: temporary
              mountPath: /tmp
            - name: secrets
              mountPath: /run/pi-cloud-secrets/database-url
              subPath: database-url
              readOnly: true
            - name: secrets
              mountPath: /run/pi-cloud-secrets/database-notification-url
              subPath: database-notification-url
              readOnly: true
            - name: secrets
              mountPath: /run/pi-cloud-secrets/supervisor-enrollment-token
              subPath: supervisor-enrollment-token
              readOnly: true
            - name: secrets
              mountPath: /run/pi-cloud-secrets/supervisor-management-token
              subPath: supervisor-management-token
              readOnly: true
            - name: secrets
              mountPath: /run/pi-cloud-secrets/tool-broker-token
              subPath: tool-broker-token
              readOnly: true
            - name: secrets
              mountPath: /run/pi-cloud-secrets/model-credential-master-key
              subPath: model-credential-master-key
              readOnly: true
            {{- if .Values.services.githubGateway.enabled }}
            - name: secrets
              mountPath: /run/pi-cloud-secrets/github-gateway-token
              subPath: github-gateway-token
              readOnly: true
            {{- end }}
            - name: secrets
              mountPath: /run/pi-cloud-secrets/metrics-token
              subPath: {{ .Values.credentials.metricsTokenKey }}
              readOnly: true
            {{- if .Values.runtime.externalWorkerEventLog }}
            - name: secrets
              mountPath: /run/pi-cloud-secrets/worker-event-ingest-token
              subPath: {{ .Values.credentials.workerEventIngestTokenKey }}
              readOnly: true
            {{- end }}
      volumes:
        - name: workspace
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.ephemeral.workspaceSizeLimit }}
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.ephemeral.temporarySizeLimit }}
        - name: secrets
          secret:
            secretName: {{ .Values.database.existingSecret }}
            defaultMode: 288
            items:
              - key: {{ .Values.database.urlKey }}
                path: database-url
              - key: {{ .Values.database.notificationUrlKey }}
                path: database-notification-url
              - key: {{ .Values.credentials.supervisorEnrollmentTokenKey }}
                path: supervisor-enrollment-token
              - key: {{ .Values.credentials.supervisorManagementTokenKey }}
                path: supervisor-management-token
              - key: {{ .Values.credentials.toolBrokerTokenKey }}
                path: tool-broker-token
              - key: {{ .Values.credentials.modelCredentialMasterKeyKey }}
                path: model-credential-master-key
              {{- if .Values.services.githubGateway.enabled }}
              - key: {{ .Values.credentials.githubGatewayTokenKey }}
                path: github-gateway-token
              {{- end }}
              - key: {{ .Values.credentials.metricsTokenKey }}
                path: metrics-token
              {{- if .Values.runtime.externalWorkerEventLog }}
              - key: {{ .Values.credentials.workerEventIngestTokenKey }}
                path: worker-event-ingest-token
              {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: worker-state
        labels:
          {{- include "pi-cloud-pi-worker-pool.pvcLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.state.accessModes | nindent 10 }}
        {{- if .Values.state.storageClassName }}
        storageClassName: {{ .Values.state.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.state.size }}
