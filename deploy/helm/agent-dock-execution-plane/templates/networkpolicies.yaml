{{- $root := . -}}
{{- range $namespace := list "agent-dock-sandboxes" "agent-dock-importers" "agent-dock-egress" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-dock-default-deny-all
  namespace: {{ $namespace }}
  labels:
    {{- include "agent-dock-execution-plane.labels" $root | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-dock-dependency-egress
  namespace: agent-dock-sandboxes
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
  annotations:
    agent-dock.io/policy-version: dependency-egress-v1
spec:
  podSelector:
    matchLabels:
      agent-dock.io/dependency-egress: "true"
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-dock-egress
          podSelector:
            matchLabels:
              agent-dock.io/workload: dependency-egress-proxy
      ports:
        - protocol: TCP
          port: 3128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dependency-egress-ingress
  namespace: agent-dock-egress
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
  annotations:
    agent-dock.io/policy-version: dependency-egress-v1
spec:
  podSelector:
    matchLabels:
      agent-dock.io/workload: dependency-egress-proxy
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-dock-sandboxes
          podSelector:
            matchLabels:
              agent-dock.io/dependency-egress: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-dock-importers
          podSelector:
            matchLabels:
              agent-dock.io/repository-egress: "true"
      ports:
        - protocol: TCP
          port: 3128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dependency-egress-public-https
  namespace: agent-dock-egress
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
  annotations:
    agent-dock.io/policy-version: dependency-egress-v1
spec:
  podSelector:
    matchLabels:
      agent-dock.io/workload: dependency-egress-proxy
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: repository-import-public-https
  namespace: agent-dock-importers
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
  annotations:
    agent-dock.io/policy-version: repository-egress-v1
spec:
  podSelector:
    matchLabels:
      agent-dock.io/repository-egress: "true"
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-dock-egress
          podSelector:
            matchLabels:
              agent-dock.io/workload: dependency-egress-proxy
      ports:
        - protocol: TCP
          port: 3128
