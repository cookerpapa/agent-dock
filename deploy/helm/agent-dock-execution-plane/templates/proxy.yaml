apiVersion: v1
kind: ConfigMap
metadata:
  name: dependency-egress-trust
  namespace: agent-dock-egress
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-egress-proxy
  namespace: agent-dock-egress
  labels:
    {{- include "agent-dock-execution-plane.proxyLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dependencyEgressProxy.replicas }}
  revisionHistoryLimit: {{ .Values.dependencyEgressProxy.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.dependencyEgressProxy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.dependencyEgressProxy.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      agent-dock.io/workload: dependency-egress-proxy
  template:
    metadata:
      labels:
        {{- include "agent-dock-execution-plane.proxyLabels" . | nindent 8 }}
      annotations:
        agent-dock.io/reconciled-by: helm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      restartPolicy: Always
      serviceAccountName: dependency-egress-proxy
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              agent-dock.io/workload: dependency-egress-proxy
      {{- with .Values.dependencyEgressProxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dependencyEgressProxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: proxy
          image: {{ include "agent-dock-execution-plane.proxyImage" . | quote }}
          imagePullPolicy: {{ .Values.dependencyEgressProxy.image.pullPolicy }}
          env:
            - name: AGENT_DOCK_DEPENDENCY_EGRESS_HOST
              value: 0.0.0.0
            - name: AGENT_DOCK_DEPENDENCY_EGRESS_PORT
              value: "3128"
            - name: AGENT_DOCK_DEPENDENCY_EGRESS_PUBLIC_KEY_FILE
              value: /run/agent-dock-egress/public-key.pem
          ports:
            - name: connect
              containerPort: 3128
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: connect
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: connect
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.dependencyEgressProxy.resources | nindent 12 }}
          volumeMounts:
            - name: trust
              mountPath: /run/agent-dock-egress
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: trust
          configMap:
            name: dependency-egress-trust
            items:
              - key: public-key.pem
                path: public-key.pem
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dependency-egress-proxy
  namespace: agent-dock-egress
  labels:
    {{- include "agent-dock-execution-plane.proxyLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    agent-dock.io/workload: dependency-egress-proxy
  ports:
    - name: connect
      protocol: TCP
      port: 3128
      targetPort: connect
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dependency-egress-proxy
  namespace: agent-dock-egress
  labels:
    {{- include "agent-dock-execution-plane.proxyLabels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.dependencyEgressProxy.disruptionBudget.minAvailable }}
  selector:
    matchLabels:
      agent-dock.io/workload: dependency-egress-proxy
