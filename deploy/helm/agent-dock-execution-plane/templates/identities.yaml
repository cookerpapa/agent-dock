apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-manager
  namespace: agent-dock-system
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-manager-token
  namespace: agent-dock-system
  annotations:
    kubernetes.io/service-account.name: sandbox-manager
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: untrusted-tool
  namespace: agent-dock-sandboxes
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: repository-importer
  namespace: agent-dock-importers
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-egress-proxy
  namespace: agent-dock-egress
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
automountServiceAccountToken: false
