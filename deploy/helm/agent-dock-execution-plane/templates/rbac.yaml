apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: agent-dock-sandboxes
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/attach", "pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-manager
  namespace: agent-dock-sandboxes
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sandbox-manager
    namespace: agent-dock-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: agent-dock-importers
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/attach", "pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-manager
  namespace: agent-dock-importers
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sandbox-manager
    namespace: agent-dock-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager-dependency-egress-reader
  namespace: agent-dock-egress
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["dependency-egress-trust"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    resourceNames: ["dependency-egress-proxy"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames:
      - agent-dock-default-deny-all
      - dependency-egress-ingress
      - dependency-egress-public-https
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-manager-dependency-egress-reader
  namespace: agent-dock-egress
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sandbox-manager
    namespace: agent-dock-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-manager-dependency-egress-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-dock-sandbox-manager-runtimeclass-reader
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    resourceNames: ["agent-dock-gvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-dock-sandbox-manager-runtimeclass-reader
  labels:
    {{- include "agent-dock-execution-plane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sandbox-manager
    namespace: agent-dock-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-dock-sandbox-manager-runtimeclass-reader
