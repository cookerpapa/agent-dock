{{- if .Values.globalPlaneEnabled }}
{{- $name := include "pi-cloud-platform.name" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-event-gateway
  labels:
    {{- include "pi-cloud-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-gateway
spec:
  replicas: {{ ternary (int .Values.eventGateway.autoscaling.minReplicas) (int .Values.eventGateway.replicas) .Values.eventGateway.autoscaling.enabled }}
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: event-gateway }
  template:
    metadata:
      labels:
        {{- include "pi-cloud-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: event-gateway
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.global.trustedNodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.trustedTolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: event-gateway }
      containers:
        - name: event-gateway
          image: {{ include "pi-cloud-platform.image" .Values.images.eventGateway | quote }}
          imagePullPolicy: {{ .Values.images.eventGateway.pullPolicy }}
          ports:
            - { name: http, containerPort: 4600 }
            - { name: metrics, containerPort: 9467 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: HOST, value: 0.0.0.0 }
            - { name: PORT, value: "4600" }
            - { name: DATABASE_URL_FILE, value: /run/pi-cloud-secrets/database-url }
            - { name: PI_CLOUD_DATABASE_NOTIFICATION_URL_FILE, value: /run/pi-cloud-secrets/database-notification-url }
            - { name: PI_CLOUD_WORKER_EVENT_INGEST_TOKEN_FILE, value: /run/pi-cloud-secrets/worker-event-ingest-token }
            - { name: PI_CLOUD_LIVE_EVENT_STORE_URL_FILE, value: /run/pi-cloud-secrets/live-event-store-url }
            - { name: PI_CLOUD_AUTO_REPAIR_LIVE_EVENTS, value: "true" }
            - name: PI_CLOUD_KAFKA_BROKERS
              value: {{ join "," .Values.external.kafka.brokers | quote }}
            - { name: PI_CLOUD_WORKER_EVENT_TOPIC, value: {{ .Values.external.kafka.topic | quote }} }
            - { name: PI_CLOUD_WORKER_EVENT_PROJECTOR_GROUP, value: {{ .Values.external.kafka.projectorGroupId | quote }} }
            {{- if .Values.external.kafka.security.enabled }}
            - { name: PI_CLOUD_KAFKA_CA_FILE, value: /run/pi-cloud-secrets/kafka-ca.crt }
            - { name: PI_CLOUD_KAFKA_USERNAME_FILE, value: /run/pi-cloud-secrets/kafka-username }
            - { name: PI_CLOUD_KAFKA_PASSWORD_FILE, value: /run/pi-cloud-secrets/kafka-password }
            {{- end }}
            - { name: PI_CLOUD_METRICS_HOST, value: 0.0.0.0 }
            - { name: PI_CLOUD_METRICS_PORT, value: "9467" }
            - { name: PI_CLOUD_METRICS_TOKEN_FILE, value: /run/pi-cloud-secrets/metrics-token }
            {{- if .Values.external.otlpTracesEndpoint }}
            - { name: PI_CLOUD_OTLP_TRACES_ENDPOINT, value: {{ .Values.external.otlpTracesEndpoint | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.eventGateway.resources | nindent 12 }}
          volumeMounts:
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/database-url, subPath: {{ .Values.external.database.secretKey }}, readOnly: true }
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/database-notification-url, subPath: {{ .Values.external.database.notificationSecretKey }}, readOnly: true }
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/metrics-token, subPath: metrics-token, readOnly: true }
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/worker-event-ingest-token, subPath: {{ .Values.external.eventIngest.tokenSecretKey }}, readOnly: true }
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/live-event-store-url, subPath: {{ .Values.external.liveEventStore.urlSecretKey }}, readOnly: true }
            {{- if .Values.external.kafka.security.enabled }}
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/kafka-ca.crt, subPath: {{ .Values.external.kafka.security.caSecretKey }}, readOnly: true }
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/kafka-username, subPath: {{ .Values.external.kafka.security.usernameSecretKey }}, readOnly: true }
            - { name: platform-secrets, mountPath: /run/pi-cloud-secrets/kafka-password, subPath: {{ .Values.external.kafka.security.passwordSecretKey }}, readOnly: true }
            {{- end }}
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: platform-secrets
          secret: { secretName: {{ .Values.global.existingSecret }}, defaultMode: 288 }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: event-gateway
  labels:
    {{- include "pi-cloud-platform.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: event-gateway }
  ports:
    - { name: http, port: 4600, targetPort: http }
    - { name: metrics, port: 9467, targetPort: metrics }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ $name }}-event-gateway }
spec:
  minAvailable: {{ max 1 (sub (ternary (int .Values.eventGateway.autoscaling.minReplicas) (int .Values.eventGateway.replicas) .Values.eventGateway.autoscaling.enabled) 1) }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: event-gateway }
{{- if .Values.eventGateway.autoscaling.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: {{ $name }}-event-gateway }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }}-event-gateway }
  pollingInterval: {{ .Values.eventGateway.autoscaling.pollingIntervalSeconds }}
  cooldownPeriod: {{ .Values.eventGateway.autoscaling.cooldownSeconds }}
  minReplicaCount: {{ .Values.eventGateway.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.eventGateway.autoscaling.maxReplicas }}
  fallback:
    failureThreshold: 3
    replicas: {{ .Values.eventGateway.autoscaling.minReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: { stabilizationWindowSeconds: 300 }
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ join "," .Values.external.kafka.brokers | quote }}
        consumerGroup: {{ .Values.external.kafka.projectorGroupId | quote }}
        topic: {{ .Values.external.kafka.topic | quote }}
        lagThreshold: {{ .Values.eventGateway.autoscaling.kafkaLagThreshold | quote }}
        activationLagThreshold: "0"
        offsetResetPolicy: earliest
        allowIdleConsumers: "true"
        scaleToZeroOnInvalidOffset: "false"
        {{- if .Values.external.kafka.security.enabled }}
        tls: enable
        sasl: scram_sha512
      authenticationRef:
        name: {{ $name }}-event-gateway-kafka
        {{- end }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.eventGateway.autoscaling.targetCpuUtilization | quote }}
{{- if .Values.external.kafka.security.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: { name: {{ $name }}-event-gateway-kafka }
spec:
  secretTargetRef:
    - { parameter: username, name: {{ .Values.global.existingSecret }}, key: {{ .Values.external.kafka.security.usernameSecretKey }} }
    - { parameter: password, name: {{ .Values.global.existingSecret }}, key: {{ .Values.external.kafka.security.passwordSecretKey }} }
    - { parameter: ca, name: {{ .Values.global.existingSecret }}, key: {{ .Values.external.kafka.security.caSecretKey }} }
{{- end }}
{{- end }}
{{- end }}
