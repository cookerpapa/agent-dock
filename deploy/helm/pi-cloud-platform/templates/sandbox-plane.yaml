{{- if .Values.sandboxPlaneEnabled }}
{{- $name := include "pi-cloud-platform.name" . -}}
apiVersion: v1
kind: Service
metadata: { name: {{ $name }}-tool-broker-headless }
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: tool-broker }
  ports:
    - { name: broker, port: 4300, targetPort: broker }
    - { name: metrics, port: 9466, targetPort: metrics }
---
apiVersion: v1
kind: Service
metadata:
  name: tool-broker
  labels:
    {{- include "pi-cloud-platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tool-broker
  ports:
    - { name: broker, port: 4300, targetPort: broker }
    - { name: metrics, port: 9466, targetPort: metrics }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-tool-broker
  labels:
    {{- include "pi-cloud-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: tool-broker
spec:
  serviceName: {{ $name }}-tool-broker-headless
  replicas: {{ .Values.sandboxPlane.toolBrokerReplicas }}
  podManagementPolicy: Parallel
  updateStrategy: { type: RollingUpdate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: tool-broker }
  template:
    metadata:
      labels:
        {{- include "pi-cloud-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: tool-broker
        pi-cloud.io/sandbox-domain: {{ .Values.sandboxPlane.domainId | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Tool Broker may be awaiting the bounded 11-minute Volume gateway
      # request during checkpoint settlement. Keep the Pod alive long enough
      # to finish or fail that operation explicitly.
      terminationGracePeriodSeconds: 720
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.global.trustedNodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.trustedTolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: tool-broker }
      containers:
        - name: tool-broker
          image: {{ include "pi-cloud-platform.image" .Values.images.toolBroker | quote }}
          imagePullPolicy: {{ .Values.images.toolBroker.pullPolicy }}
          ports:
            - { name: broker, containerPort: 4300 }
            - { name: metrics, containerPort: 9466 }
          env:
            - { name: NODE_ENV, value: production }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: DATABASE_URL_FILE, value: /run/pi-cloud-secrets/database-url }
            - { name: PI_CLOUD_SANDBOX_DOMAIN_ID, value: {{ .Values.sandboxPlane.domainId | quote }} }
            - name: PI_CLOUD_TOOL_BROKER_ADVERTISED_URL
              value: {{ printf "http://$(POD_NAME).%s-tool-broker-headless:4300" $name | quote }}
            - { name: PI_CLOUD_TOOL_BROKER_HOST, value: 0.0.0.0 }
            - { name: PI_CLOUD_TOOL_BROKER_PORT, value: "4300" }
            - { name: PI_CLOUD_SANDBOX_WARM_TTL_MS, value: {{ .Values.sandboxPlane.warmTtlMs | quote }} }
            - { name: PI_CLOUD_MAXIMUM_ACTIVE_TOOL_SANDBOXES, value: {{ .Values.sandboxPlane.maximumActivePerReplica | quote }} }
            - { name: PI_CLOUD_MAXIMUM_WARM_SANDBOXES, value: {{ .Values.sandboxPlane.maximumWarmPerReplica | quote }} }
            - { name: PI_CLOUD_TOOL_BROKER_TOKEN_FILE, value: /run/pi-cloud-secrets/tool-broker-token }
            - { name: PI_CLOUD_SANDBOX_MATERIALIZER_TOKEN_FILE, value: /run/pi-cloud-secrets/sandbox-materializer-token }
            - { name: PI_CLOUD_WORKSPACE_TERMINAL_TOKEN_FILE, value: /run/pi-cloud-secrets/workspace-terminal-token }
            - { name: PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_URL, value: http://workspace-volume-gateway:4500 }
            - { name: PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_TOKEN_FILE, value: /run/pi-cloud-secrets/workspace-volume-gateway-token }
            - { name: PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_REQUEST_TIMEOUT_MS, value: {{ .Values.sandboxPlane.volumeGatewayRequestTimeoutMs | quote }} }
            - { name: PI_CLOUD_IMAGE_REVISION, value: {{ .Values.global.imageRevision | quote }} }
            - { name: PI_CLOUD_CUBESANDBOX_API_URL, value: {{ .Values.sandboxPlane.cube.apiUrl | quote }} }
            - { name: PI_CLOUD_CUBESANDBOX_API_KEY_FILE, value: /run/pi-cloud-secrets/cubesandbox-api-key }
            - { name: PI_CLOUD_CUBESANDBOX_TEMPLATE_ID, value: {{ .Values.sandboxPlane.cube.templateId | quote }} }
            - { name: PI_CLOUD_CUBESANDBOX_PROXY_NODE_IP, value: {{ .Values.sandboxPlane.cube.proxyNodeIp | quote }} }
            - { name: PI_CLOUD_CUBESANDBOX_PROXY_PORT, value: {{ .Values.sandboxPlane.cube.proxyPort | quote }} }
            - { name: PI_CLOUD_CUBESANDBOX_PROXY_SCHEME, value: {{ .Values.sandboxPlane.cube.proxyScheme | quote }} }
            - { name: PI_CLOUD_CUBESANDBOX_DOMAIN, value: {{ .Values.sandboxPlane.cube.domain | quote }} }
            - { name: PI_CLOUD_CUBESANDBOX_EGRESS_PROXY_HOST, value: {{ .Values.sandboxPlane.cube.egressProxyHost | quote }} }
            - { name: PI_CLOUD_CUBESANDBOX_EGRESS_PROXY_PORT, value: {{ .Values.sandboxPlane.cube.egressProxyPort | quote }} }
            - { name: PI_CLOUD_METRICS_HOST, value: 0.0.0.0 }
            - { name: PI_CLOUD_METRICS_PORT, value: "9466" }
            - { name: PI_CLOUD_METRICS_TOKEN_FILE, value: /run/pi-cloud-secrets/metrics-token }
          readinessProbe: { httpGet: { path: /health/ready, port: broker }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: broker }, periodSeconds: 10, timeoutSeconds: 3 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.sandboxPlane.toolBrokerResources | nindent 12 }}
          volumeMounts:
            - { name: secrets, mountPath: /run/pi-cloud-secrets/database-url, subPath: database-url, readOnly: true }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/tool-broker-token, subPath: tool-broker-token, readOnly: true }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/sandbox-materializer-token, subPath: sandbox-materializer-token, readOnly: true }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/workspace-terminal-token, subPath: workspace-terminal-token, readOnly: true }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/workspace-volume-gateway-token, subPath: workspace-volume-gateway-token, readOnly: true }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/cubesandbox-api-key, subPath: cubesandbox-api-key, readOnly: true }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/metrics-token, subPath: metrics-token, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          secret: { secretName: {{ .Values.global.existingSecret }}, defaultMode: 288 }
        - { name: tmp, emptyDir: { sizeLimit: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: workspace-volume-gateway }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: workspace-volume-gateway }
  ports:
    - { name: volume-gateway, port: 4500, targetPort: volume-gateway }
    - { name: metrics, port: 9469, targetPort: metrics }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-workspace-volume-gateway
  labels:
    {{- include "pi-cloud-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: workspace-volume-gateway
spec:
  replicas: {{ .Values.sandboxPlane.volumeGatewayReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: workspace-volume-gateway }
  template:
    metadata:
      labels:
        {{- include "pi-cloud-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: workspace-volume-gateway
        pi-cloud.io/sandbox-domain: {{ .Values.sandboxPlane.domainId | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 720
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: workspace-volume-gateway
          image: {{ include "pi-cloud-platform.image" .Values.images.toolBroker | quote }}
          imagePullPolicy: {{ .Values.images.toolBroker.pullPolicy }}
          command: [node, /app/node_modules/tsx/dist/cli.mjs, --tsconfig, /app/packages/tool-broker/tsconfig.json, /app/packages/tool-broker/src/workspace-volume-gateway-main.ts]
          ports:
            - { name: volume-gateway, containerPort: 4500 }
            - { name: metrics, containerPort: 9469 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: DATABASE_URL_FILE, value: /run/pi-cloud-secrets/database-url }
            - { name: PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_HOST, value: 0.0.0.0 }
            - { name: PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_PORT, value: "4500" }
            - { name: PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_TOKEN_FILE, value: /run/pi-cloud-secrets/workspace-volume-gateway-token }
            - { name: PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_MAXIMUM_CONCURRENT_OPERATIONS, value: {{ .Values.sandboxPlane.volumeGatewayMaximumConcurrentOperations | quote }} }
            - { name: PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_MAXIMUM_QUEUED_OPERATIONS, value: {{ .Values.sandboxPlane.volumeGatewayMaximumQueuedOperations | quote }} }
            - { name: PI_CLOUD_WORKSPACE_VOLUME_GATEWAY_QUEUE_WAIT_TIMEOUT_MS, value: {{ .Values.sandboxPlane.volumeGatewayQueueWaitTimeoutMs | quote }} }
            - { name: PI_CLOUD_WORKSPACE_DELETION_REAPER_INTERVAL_MS, value: {{ .Values.sandboxPlane.workspaceDeletionReaperIntervalMs | quote }} }
            - { name: PI_CLOUD_WORKSPACE_DELETION_REAPER_BATCH_SIZE, value: {{ .Values.sandboxPlane.workspaceDeletionReaperBatchSize | quote }} }
            - { name: PI_CLOUD_WORKSPACE_POSIX_ROOT, value: /data/workspaces }
            - { name: PI_CLOUD_METRICS_HOST, value: 0.0.0.0 }
            - { name: PI_CLOUD_METRICS_PORT, value: "9469" }
            - { name: PI_CLOUD_METRICS_TOKEN_FILE, value: /run/pi-cloud-secrets/metrics-token }
          startupProbe: { httpGet: { path: /health/ready, port: volume-gateway }, periodSeconds: 5, failureThreshold: 60 }
          livenessProbe: { httpGet: { path: /health/live, port: volume-gateway }, periodSeconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.sandboxPlane.volumeGatewayResources | nindent 12 }}
          volumeMounts:
            - { name: workspace-rwx, mountPath: /data/workspaces }
            - { name: gateway-state, mountPath: /var/lib/pi-cloud }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/database-url, subPath: database-url, readOnly: true }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/workspace-volume-gateway-token, subPath: workspace-volume-gateway-token, readOnly: true }
            - { name: secrets, mountPath: /run/pi-cloud-secrets/metrics-token, subPath: metrics-token, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: workspace-rwx, persistentVolumeClaim: { claimName: {{ .Values.sandboxPlane.workspace.existingClaim }} } }
        - { name: gateway-state, emptyDir: { sizeLimit: {{ .Values.sandboxPlane.state.size }} } }
        - name: secrets
          secret: { secretName: {{ .Values.global.existingSecret }}, defaultMode: 288 }
        - { name: tmp, emptyDir: { sizeLimit: 128Mi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ $name }}-tool-broker }
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: tool-broker }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ $name }}-workspace-volume-gateway }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: workspace-volume-gateway }
{{- end }}
