{{- if .Values.globalPlaneEnabled }}
{{- $name := include "pi-cloud-platform.name" . -}}
{{- $toolBrokerUrls := list -}}
{{- range .Values.sandboxDomains -}}
{{- $toolBrokerUrls = append $toolBrokerUrls .toolBrokerBaseUrl -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-control-plane
  labels:
    {{- include "pi-cloud-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ ternary (int .Values.controlPlane.autoscaling.minReplicas) (int .Values.controlPlane.replicas) .Values.controlPlane.autoscaling.enabled }}
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: control-plane }
  template:
    metadata:
      labels:
        {{- include "pi-cloud-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.global.trustedNodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.trustedTolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: control-plane }
      containers:
        - name: control-plane
          image: {{ include "pi-cloud-platform.image" .Values.images.controlPlane | quote }}
          imagePullPolicy: {{ .Values.images.controlPlane.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9464 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: HOST, value: 0.0.0.0 }
            - { name: PORT, value: "3000" }
            - { name: DATABASE_URL_FILE, value: /run/pi-cloud-secrets/database-url }
            - { name: PI_CLOUD_DATABASE_NOTIFICATION_URL_FILE, value: /run/pi-cloud-secrets/database-notification-url }
            - { name: PI_CLOUD_KAFKA_BROKERS, value: {{ join "," .Values.external.kafka.brokers | quote }} }
            - { name: PI_CLOUD_KAFKA_RAW_EVENT_TOPIC, value: {{ .Values.external.kafka.rawEventTopic | quote }} }
            - { name: PI_CLOUD_KAFKA_ACCEPTED_EVENT_TOPIC, value: {{ .Values.external.kafka.acceptedEventTopic | quote }} }
            - { name: PI_CLOUD_KAFKA_SESSION_MUTATION_TOPIC, value: {{ .Values.external.kafka.sessionMutationTopic | quote }} }
            - { name: PI_CLOUD_SUPERVISOR_ENROLLMENT_TOKEN_FILE, value: /run/pi-cloud-secrets/supervisor-enrollment-token }
            - { name: PI_CLOUD_SUPERVISOR_MANAGEMENT_TOKEN_FILE, value: /run/pi-cloud-secrets/supervisor-management-token }
            - { name: PI_CLOUD_MODEL_CREDENTIAL_MASTER_KEY_FILE, value: /run/pi-cloud-secrets/model-credential-master-key }
            - { name: PI_CLOUD_CUBE_EGRESS_CONFIG_TOKEN_FILE, value: /run/pi-cloud-secrets/cube-egress-config-token }
            - { name: PI_CLOUD_SANDBOX_MATERIALIZER_TOKEN_FILE, value: /run/pi-cloud-secrets/sandbox-materializer-token }
            - { name: PI_CLOUD_WORKSPACE_TERMINAL_TOKEN_FILE, value: /run/pi-cloud-secrets/workspace-terminal-token }
            - name: PI_CLOUD_TOOL_BROKER_URLS
              value: {{ join "," $toolBrokerUrls | quote }}
            - { name: PI_CLOUD_IMAGE_REVISION, value: {{ .Values.global.imageRevision | quote }} }
            - { name: PI_CLOUD_ALLOW_INSECURE_INTERNAL_HTTP, value: "true" }
            - { name: PI_CLOUD_SUPERVISOR_ID_PREFIX, value: {{ .Values.controlPlane.supervisorIdPrefix | quote }} }
            - { name: PI_CLOUD_SUPERVISOR_MAXIMUM_CAPACITY, value: {{ (index .Values "pi-workers").workerPool.capacity | quote }} }
            - name: PI_CLOUD_SUPERVISOR_MANAGEMENT_URL_TEMPLATES
              value: {{ printf "http://{supervisorId}.pi-cloud-pi-worker-%s.%s.svc.%s:4100" (index .Values "pi-workers").workerPool.name .Release.Namespace .Values.global.clusterDomain | quote }}
            - { name: PI_CLOUD_PLATFORM_MODEL_SOURCE_TENANT_ID, value: {{ .Values.controlPlane.platformModelSourceTenantId | quote }} }
            - { name: PI_CLOUD_PLATFORM_OPERATOR_TENANT_ID, value: {{ .Values.controlPlane.platformOperatorTenantId | quote }} }
            - { name: PI_CLOUD_PUBLIC_REGISTRATION_ENABLED, value: {{ .Values.controlPlane.publicRegistration.enabled | quote }} }
            - { name: PI_CLOUD_PUBLIC_REGISTRATION_MAXIMUM_TENANTS, value: {{ .Values.controlPlane.publicRegistration.maximumTenants | quote }} }
            - { name: PI_CLOUD_PUBLIC_TENANT_MAXIMUM_PROJECTS, value: {{ .Values.controlPlane.publicRegistration.maximumProjects | quote }} }
            - { name: PI_CLOUD_PUBLIC_TENANT_MAXIMUM_SESSIONS, value: {{ .Values.controlPlane.publicRegistration.maximumSessions | quote }} }
            - { name: PI_CLOUD_PUBLIC_TENANT_MAXIMUM_UNSETTLED_TURNS, value: {{ .Values.controlPlane.publicRegistration.maximumUnsettledTurns | quote }} }
            - { name: PI_CLOUD_PUBLIC_TENANT_MAXIMUM_CONCURRENT_TURNS, value: {{ .Values.controlPlane.publicRegistration.maximumConcurrentTurns | quote }} }
            - { name: PI_CLOUD_PUBLIC_TENANT_MAXIMUM_ACTIVE_SANDBOXES, value: {{ .Values.controlPlane.publicRegistration.maximumActiveSandboxes | quote }} }
            - { name: PI_CLOUD_WEB_SESSION_COOKIE_SECURE, value: "true" }
            - { name: PI_CLOUD_METRICS_HOST, value: 0.0.0.0 }
            - { name: PI_CLOUD_METRICS_PORT, value: "9464" }
            - { name: PI_CLOUD_METRICS_TOKEN_FILE, value: /run/pi-cloud-secrets/metrics-token }
            {{- if .Values.external.otlpTracesEndpoint }}
            - { name: PI_CLOUD_OTLP_TRACES_ENDPOINT, value: {{ .Values.external.otlpTracesEndpoint | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            {{- include "pi-cloud-platform.secretMounts" . | nindent 12 }}
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: platform-secrets
          secret: { secretName: {{ .Values.global.existingSecret }}, defaultMode: 288 }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  labels:
    {{- include "pi-cloud-platform.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: control-plane }
  ports:
    - { name: http, port: 3000, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ $name }}-control-plane }
spec:
  minAvailable: {{ max 1 (sub (ternary (int .Values.controlPlane.autoscaling.minReplicas) (int .Values.controlPlane.replicas) .Values.controlPlane.autoscaling.enabled) 1) }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: control-plane }
{{- if .Values.controlPlane.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ $name }}-control-plane }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }}-control-plane }
  minReplicas: {{ .Values.controlPlane.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.controlPlane.autoscaling.maxReplicas }}
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.controlPlane.autoscaling.targetCpuUtilization }} }
{{- end }}
{{- end }}
