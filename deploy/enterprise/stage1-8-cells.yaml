apiVersion: agent-dock.io/v1alpha1
kind: EnterpriseCellProfile
metadata:
  name: stage1-8-cells
spec:
  baseValues: deploy/helm/agent-dock-platform/values.distributed.example.yaml
  globalNamespace: agent-dock-system
  globalRelease: agent-dock
  cellNamespacePrefix: agent-dock-cell-
  cellReleasePrefix: agent-dock-cell-
  sandboxDomainNamespace: agent-dock-sandbox-0001
  sandboxDomainRelease: agent-dock-sandbox-0001
  sandboxDomainId: sandbox-domain-0001
  clusterDomain: cluster.local
  cubeApiUrl: https://cube-api.example.com
  cubeProxyNodeIp: cube-proxy.example.com
  cubeDomain: cube.example.com
  cellCount: 8
  workerCapacity: 4
  minimumWorkersPerCell: 2
  maximumWorkersPerCell: 64
  toolBrokerReplicas: 5
  dataMoverReplicas: 3
  toolBrokerMaximumActivePerReplica: 512
  maximumActiveSandboxes: 2048
  controlPlaneMaximumReplicas: 24
  eventGatewayMaximumReplicas: 64
