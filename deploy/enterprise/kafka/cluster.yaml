apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controllers
  namespace: pi-cloud-eventing
  labels:
    strimzi.io/cluster: pi-cloud-kafka
spec:
  replicas: 3
  roles: [controller]
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { cpu: "4", memory: 8Gi }
  storage:
    type: persistent-claim
    size: 100Gi
    deleteClaim: false
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/pool-name
                    operator: In
                    values: [controllers]
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: pi-cloud-kafka
              strimzi.io/controller-role: "true"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: brokers
  namespace: pi-cloud-eventing
  labels:
    strimzi.io/cluster: pi-cloud-kafka
spec:
  replicas: 6
  roles: [broker]
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { cpu: "8", memory: 16Gi }
  storage:
    type: persistent-claim
    size: 1Ti
    deleteClaim: false
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/pool-name
                    operator: In
                    values: [brokers]
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: pi-cloud-kafka
              strimzi.io/broker-role: "true"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: pi-cloud-kafka
  namespace: pi-cloud-eventing
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.0.0
    metadataVersion: 4.0-IV3
    rack:
      type: topology-label
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: internal
        port: 9093
        type: internal
        tls: true
        authentication: { type: scram-sha-512 }
    config:
      min.insync.replicas: 2
      default.replication.factor: 3
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      unclean.leader.election.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: pi-cloud-worker-events-v1
  namespace: pi-cloud-eventing
  labels:
    strimzi.io/cluster: pi-cloud-kafka
spec:
  topicName: pi-cloud-worker-events-v1
  partitions: 256
  replicas: 3
  config:
    min.insync.replicas: 2
    cleanup.policy: delete
    retention.ms: "604800000"
    segment.bytes: "536870912"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: pi-cloud-event-gateway
  namespace: pi-cloud-eventing
  labels:
    strimzi.io/cluster: pi-cloud-kafka
spec:
  authentication: { type: scram-sha-512 }
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: pi-cloud-worker-events-v1, patternType: literal }
        operations: [Read, Write, Describe]
        host: "*"
      - resource: { type: group, name: pi-cloud-worker-event-projector-v2, patternType: literal }
        operations: [Read, Describe]
        host: "*"
      - resource: { type: cluster, name: kafka-cluster, patternType: literal }
        operations: [IdempotentWrite, Describe]
        host: "*"
