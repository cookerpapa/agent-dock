apiVersion: v1
kind: ServiceAccount
metadata:
  name: pi-cloud-cube-template-registry
  namespace: cube-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-cloud-cube-template-registry
  namespace: cube-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-cloud-cube-template-registry
  namespace: cube-system
  labels:
    app.kubernetes.io/name: pi-cloud-cube-template-registry
    app.kubernetes.io/component: template-registry
    app.kubernetes.io/managed-by: pi-cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-cloud-cube-template-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-cloud-cube-template-registry
        app.kubernetes.io/component: template-registry
        app.kubernetes.io/managed-by: pi-cloud
    spec:
      serviceAccountName: pi-cloud-cube-template-registry
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_HTTP_ADDR
              value: :5000
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "false"
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /v2/
              port: registry
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /v2/
              port: registry
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: pi-cloud-cube-template-registry
        - name: tls
          secret:
            secretName: pi-cloud-cube-template-registry-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pi-cloud-cube-template-registry
  namespace: cube-system
  labels:
    app.kubernetes.io/name: pi-cloud-cube-template-registry
    app.kubernetes.io/component: template-registry
    app.kubernetes.io/managed-by: pi-cloud
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pi-cloud-cube-template-registry
  ports:
    - name: https-registry
      port: 5000
      targetPort: registry
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pi-cloud-cube-template-registry
  namespace: cube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pi-cloud-cube-template-registry
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: master
      ports:
        - protocol: TCP
          port: 5000
  egress: []
