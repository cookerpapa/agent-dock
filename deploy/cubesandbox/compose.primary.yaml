services:
  tool-broker:
    depends_on:
      cube-api-relay:
        condition: service_healthy
      cube-proxy-relay:
        condition: service_healthy
    environment:
      PI_CLOUD_CUBESANDBOX_API_URL: http://cube-api-relay:3000
      PI_CLOUD_CUBESANDBOX_API_KEY_FILE: /run/pi-cloud-secrets/cubesandbox-api-key
      PI_CLOUD_CUBESANDBOX_TEMPLATE_ID: ${PI_CLOUD_CUBESANDBOX_TEMPLATE_ID:?set the READY Cube template ID}
      PI_CLOUD_CUBESANDBOX_DEVELOPMENT_TEMPLATE_IDS: ${PI_CLOUD_CUBESANDBOX_DEVELOPMENT_TEMPLATE_IDS:?set the READY Cube development template catalog}
      PI_CLOUD_CUBESANDBOX_PROXY_NODE_IP: cube-proxy-relay
      PI_CLOUD_CUBESANDBOX_PROXY_PORT: "8080"
      PI_CLOUD_CUBESANDBOX_PROXY_SCHEME: http
      PI_CLOUD_CUBESANDBOX_DOMAIN: ${PI_CLOUD_CUBESANDBOX_DOMAIN:?set the CubeProxy sandbox domain}
      PI_CLOUD_CUBESANDBOX_REQUEST_TIMEOUT_MS: "30000"
      PI_CLOUD_CUBESANDBOX_EGRESS_PROXY_HOST: "10.255.255.254"
      PI_CLOUD_CUBESANDBOX_EGRESS_PROXY_PORT: "3128"
    volumes:
      - type: bind
        source: ${PI_CLOUD_RUNTIME_DIRECTORY:?run npm run production:init first}/secrets/cubesandbox-api-key
        target: /run/pi-cloud-secrets/cubesandbox-api-key
        read_only: true
    networks:
      - sandbox-control
      - observability
      - cube-control

  cube-api-relay:
    image: pi-cloud/tool-broker:${PI_CLOUD_IMAGE_VERSION:-production}
    restart: unless-stopped
    command: [/app/packages/tool-broker/src/fixed-tcp-relay.ts]
    environment:
      PI_CLOUD_FIXED_RELAY_LISTEN_PORT: "3000"
      PI_CLOUD_FIXED_RELAY_UPSTREAM_HOST: ${PI_CLOUD_CUBESANDBOX_API_NODE_IP:?set the private CubeAPI node IP}
      PI_CLOUD_FIXED_RELAY_UPSTREAM_PORT: ${PI_CLOUD_CUBESANDBOX_API_NODE_PORT:-3000}
      PI_CLOUD_FIXED_RELAY_MAXIMUM_CONNECTIONS: "64"
      PI_CLOUD_FIXED_RELAY_IDLE_TIMEOUT_MS: "300000"
    networks:
      - cube-control
      - cube-host-egress
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('node:net').connect(3000,'127.0.0.1');s.setTimeout(2000);s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',()=>process.exit(1));s.once('timeout',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    user: "${PI_CLOUD_APPLICATION_UID:-1000}:${PI_CLOUD_APPLICATION_GID:-1000}"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777,uid=${PI_CLOUD_APPLICATION_UID:-1000},gid=${PI_CLOUD_APPLICATION_GID:-1000}
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  cube-proxy-relay:
    image: pi-cloud/tool-broker:${PI_CLOUD_IMAGE_VERSION:-production}
    restart: unless-stopped
    command: [/app/packages/tool-broker/src/fixed-tcp-relay.ts]
    environment:
      PI_CLOUD_FIXED_RELAY_LISTEN_PORT: "8080"
      PI_CLOUD_FIXED_RELAY_UPSTREAM_HOST: ${PI_CLOUD_CUBESANDBOX_PROXY_NODE_IP:?set the private CubeProxy node IP}
      PI_CLOUD_FIXED_RELAY_UPSTREAM_PORT: ${PI_CLOUD_CUBESANDBOX_PROXY_NODE_PORT:-80}
      PI_CLOUD_FIXED_RELAY_MAXIMUM_CONNECTIONS: "128"
      PI_CLOUD_FIXED_RELAY_IDLE_TIMEOUT_MS: "300000"
    networks:
      - cube-control
      - cube-host-egress
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('node:net').connect(8080,'127.0.0.1');s.setTimeout(2000);s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',()=>process.exit(1));s.once('timeout',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    user: "${PI_CLOUD_APPLICATION_UID:-1000}:${PI_CLOUD_APPLICATION_GID:-1000}"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777,uid=${PI_CLOUD_APPLICATION_UID:-1000},gid=${PI_CLOUD_APPLICATION_GID:-1000}
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

networks:
  cube-control:
    internal: true
  cube-host-egress: {}
